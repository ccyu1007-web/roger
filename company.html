5. 用 Markdown 格式回傳（## 標題、**粗體**、條列、段落間空行）。
6. 估值與財務體質已由系統處理，本分析不涵蓋。
7. 來源只能支持「事實」，不能把來源本身當成「判斷的證明」。所有因果關係、競爭優勢、成長推論及風險重要性仍須標示 [判斷]。管理層的預期、目標、展望或預測，應標示為公司說法，不得直接視為已發生事實；若據此推導未來影響，仍須標示 [判斷]。涉及法律程序（上市、審批、許可、訴訟等）的事件，必須使用精確的程序或階段名稱（如「已受理」「已問詢」「取得輔導驗收函」），不可用籠統的「通過驗收」「完成審批」；若無法確認精確階段，標「待查證」。
8. 涉及目前競爭地位、客戶結構、訂單、產能、產品需求或產業環境的判斷，應優先採用最近一期年報、季報、法說會或其他近期公開資料；若只有舊資料，須明確標示資料年份，不得將歷史資料直接視為目前狀況。
9. 產業層面的風險或趨勢不得直接視為公司風險。必須說明該產業因素如何透過產品、客戶、價格、市佔率、成本或競爭地位實際影響該公司，才能列為公司的重大風險。[判斷]
10. 產能擴充、新廠投產等事件與營收或獲利變化之間，若缺乏產能利用率、稼動率等中間變數的直接數據，不可直接建立因果關係（如「新廠投產卻未帶動營收」）。應分別陳述事實，並將因果推論明確標示為 [判斷]，同時註明缺乏哪些中間數據。
11. 未來成長率（g）推估須基於質性分析的合理判斷，不可憑空推論。管理層口頭目標、新聞報導展望須打折處理，不可直接採用。推估須參考公司歷史 5 年營收 CAGR、護城河強度、具體成長驅動力與營收佔比、市場共識估值。高成長率（>15%）必須有具體產能、訂單或合約數據支撐。推估結果與歷史 CAGR 或當期 YoY 差異顯著時，必須明確說明原因。

---

## 一、公司速描
主營業務與商業模式（怎麼賺錢、價值鏈定位）。營收結構按產品線拆解，每個產品線標明佔營收比重、主要客戶、近期趨勢（成長/持平/衰退），讓讀者能判斷各業務的重要性差異（附來源，查不到標待查證）。地區營收佔比（附來源）。產能佈局（主要生產基地與分工）。最近完整年度營收、EPS、毛利率（附來源）。產業處於成長/成熟/衰退哪個階段。[判斷]

## 二、護城河
- 第一行給結論：護城河強度（強/中/弱/無）+ 核心來源 + 趨勢（變強/穩定/變弱）。
- 針對最關鍵的 1–2 個護城河來源展開（每個 3–5 行，含具體數據、客戶名、市佔率佐證，附來源）。不需要所有來源都列，只講真正構成優勢的。
- 不得僅以市佔率、營收規模或獲利率高判定護城河。必須說明競爭者為何難以複製該優勢，以及該優勢是否能長期維持。
- 護城河趨勢必須根據近年可觀察的競爭地位、客戶黏著度、市佔率、產品認證、技術能力、成本優勢或競爭者進入情況判定，不得僅因營收或獲利成長即判定護城河變強。
- 前五大客戶及前五大供應商集中度（附來源，查不到者標「待查證」）。
- 最後一行：最可能讓護城河變淺的單一最大威脅。

## 三、成長亮點（未來 1–2 年）
- 已發生的近期催化劑（新合約、擴產、法說會釋出訊息，附來源與時間）。
- 未來 1–2 年最可能推動營收或獲利的 1–2 個驅動力。必須區分「已發生／已確認事實」與「推論判斷」，事實附來源，推論標 [判斷]。
- 討論成長驅動力時，應說明該業務佔營收比重，讓讀者能判斷其對整體獲利的實際影響程度。佔比小的業務不宜與主力業務同等篇幅描述。

### 市場共識成長估值
搜尋近 12 個月內券商研究報告、法人預估或市場研究機構對該公司的營收/EPS 成長率預估，列出 2~3 個來源。每筆須包含：
- 來源機構與日期（如「凱基證券 2026/05」「元大投顧 2026/03」）
- 預估內容（營收成長率、EPS 預估值、目標價等）
- 若搜尋不到，寫「未找到近期券商研究報告」，不得編造

### 合理成長率推估（g）
綜合以下面向，給出未來 1~3 年合理營收年化成長率區間（如：8%~12%）。[判斷]

**推估依據**（逐項列出，每項附來源或標 [判斷]）：
- **護城河與競爭地位**：護城河強度與趨勢如何影響公司維持或擴大市佔的能力
- **產業趨勢**：所處產業的成長階段與 CAGR，該公司在產業中的位置
- **具體成長驅動力**：擴產進度、新客戶/新產品、訂單能見度，標明各驅動力對應的營收佔比
- **歷史成長實績**：過去 5 年營收 CAGR 為多少？代表公司在完整景氣循環中實際做到的成長速度，作為推估的參考基準（非限制）
- **當期動能**：當期累積營收 YoY 為多少？與歷史 CAGR 的差異是否合理？若差異大，說明原因（低基期反彈、一次性急單、新產能貢獻、景氣循環等）
- **市場共識**：上方券商預估與自身推估的差異，若差異大須說明

**防止過度樂觀的檢核**：
- 管理層口頭目標、新聞報導展望須打折處理，不可直接採用
- 高成長率（>15%）必須有具體產能、訂單或合約數據支撐，否則須說明為何合理
- 若成長主要來自低基期反彈而非結構性變化，須明確標示

**結論**：一句話給出推估區間與信心程度（如「合理 g 約 8%~12%，信心中等，主要不確定性來自新產能稼動進度」）。

### Neff g 建議值
基於上方合理成長率推估，輸出用於 Neff 比率計算的**單一整數**（不給區間）。
- 取合理 g 區間的**中偏保守值**（例如區間 8%~12% 則取 9 或 10）
- 上限 15，超過須有極強證據支撐
- 輸出格式為「**Neff g = X**」，附一句話說明推估核心依據

## 四、注意事項
- **目前好數字在什麼情境下不持續？**
  聚焦未來 24 個月內可能發生、且已有近期證據支持的 1–2 個核心因素（景氣循環、產品價格、客戶訂單、競爭、產能、一次性收益等）。[來源/判斷]
  不得僅以缺乏近期證據的長期假設推演。

- **短期風險（正在發生或未來兩年內可能發生）[判斷]**
  列出 1–2 個最值得投資人關注的短期空方因素。每個風險須包含：
  （1）風險描述：具體說明什麼事正在發生或可能發生
  （2）影響程度：對營收/獲利/股價的影響有多大（輕微/中等/重大），帶具體數字推算
  （3）可驗證性：用什麼指標或事件可以持續追蹤驗證
  （4）反向證據：近期是否有反駁該風險的數據或事實
  優先選擇已有近期證據支持、且足以影響投資論點的風險。若公司近期數據已明顯反駁該風險，降低其重要性。
  若目前沒有足以推翻投資論點的重大空方因素，明確寫「目前未發現足以推翻投資論點的重大空方因素」，不得強行推演。

- **長期風險（兩年後可能發生，最多 1–2 項）**
  若存在主要影響時間在兩年以上的結構性風險，不得與短期風險混為一談；若目前缺乏明確證據，僅列為「長期觀察事項」。[判斷]
  若不存在具體且值得追蹤的長期結構性風險，則不需列出。
  此項不等同於 structural_risk；只有目前已出現且已有近期證據支持的結構性問題，才能填 structural_risk＝「有」。

- **本次分析的資料盲區**
  列出真正會影響判斷、但目前查不到或來源過舊的關鍵資料。

【完成後自動寫入 Render（含結構化摘要）】
分析完成後，根據分析內容填寫結構化欄位，然後連同筆記一起寫入 Render：
- moat_strength：從分析中判斷，填「強/中/弱/無」
- moat_source：JSON array，從「品牌/轉換成本/網路效應/成本優勢/技術與專利/認證與客戶驗證/規模經濟/供應鏈地位」中選
- moat_trend：填「變強/穩定/變弱」
- moat_desc：一句話描述護城河的具體內容與依據，不可用通用說明（如「博弈執照壁壘高，IP庫+數學模型形成轉換成本」）
- structural_risk：只有在公司目前已出現、已有近期證據支持，且可能持續影響未來 24 個月以上競爭地位或獲利能力的結構性問題時才填「有」。景氣循環、短期需求下降、原物料波動或尚無近期證據的長期假設，不得判定為結構性風險
- structural_risk_desc：有風險時簡述
- growth_catalyst：從成長亮點摘要近期催化劑
- investment_monitor：未來 6–24 個月最值得持續追蹤的 2–3 個指標或事件，JSON array。不僅包含風險，也包含用來驗證成長與投資論點是否如預期發展的正面指標
- confidence：綜合判斷「資料完整度」+「關鍵判斷是否有直接證據」，填「高/中/低」。資料多但關鍵問題（客戶集中度、訂單能見度、競爭地位）缺乏直接證據時，不得填「高」。若核心投資論點主要建立於管理層預期、產業推估或間接證據，而非已發生的客觀數據，不得填「高」
- confidence_desc：一句話描述信心度判定的具體依據，說明哪些有直接證據、哪些缺乏（如「法說會+年報佐證完整，但客戶集中度未揭露」）
- neff_g：Neff g 建議值，填單一整數（如 8），基於上方合理成長率推估取中偏保守值
- lynch_override：通常留空（自動判斷），除非分類明顯不合理才填

function _getMonitorTags() {
  const tags = [];
  document.querySelectorAll('#monitorTags span[data-tag]').forEach(el => tags.push(el.getAttribute('data-tag')));
  return tags;
}

function _renderMonitorTags(items) {
  const container = document.getElementById('monitorTags');
  if (!container) return;
  container.innerHTML = items.map((item, i) =>
    `<span data-tag="${item.replace(/"/g,'&quot;')}" style="display:inline-flex;align-items:center;gap:2px;background:#e0f2fe;color:#0369a1;padding:2px 8px;border-radius:12px;font-size:.78rem">${item}<span onclick="removeMonitorTag(${i})" style="cursor:pointer;margin-left:2px;color:#94a3b8;font-weight:700">&times;</span></span>`
  ).join('');
}

function addMonitorTag() {
  const input = document.getElementById('monitorInput');
  const val = (input?.value || '').trim();
  if (!val) return;
  const tags = _getMonitorTags();
  if (!tags.includes(val)) {
    tags.push(val);
    _renderMonitorTags(tags);
    onMetaChange();
  }
  input.value = '';
}

function removeMonitorTag(idx) {
  const tags = _getMonitorTags();
  tags.splice(idx, 1);
  _renderMonitorTags(tags);
  onMetaChange();
}

function _collectMeta() {
  const moatEl = document.querySelector('input[name="nm_moat"]:checked');
  const moatTrendEl = document.querySelector('input[name="nm_moat_trend"]:checked');
  const riskEl = document.querySelector('input[name="nm_risk"]:checked');
  const confEl = document.querySelector('input[name="nm_conf"]:checked');
  const srcs = [];
  document.querySelectorAll('.cb_moat_src:checked').forEach(cb => srcs.push(cb.value));
  return {
    moat_strength: moatEl ? moatEl.value : '',
    moat_source: JSON.stringify(srcs),
    moat_trend: moatTrendEl ? moatTrendEl.value : '',
    structural_risk: riskEl ? riskEl.value : '',
    structural_risk_desc: (document.getElementById('riskDesc')?.value || '').trim(),
    growth_catalyst: (document.getElementById('growthCat')?.value || '').trim(),
    investment_monitor: JSON.stringify(_getMonitorTags()),
    confidence: confEl ? confEl.value : '',
    lynch_override: document.getElementById('lynchOver')?.value || ''
  };
}

let _metaTimer = null;
function onMetaChange() {
  clearTimeout(_metaTimer);
  _metaTimer = setTimeout(() => {
    const text = document.getElementById('notesArea')?.value || '';
    const meta = _collectMeta();
    window._notesMeta = meta;
    const body = text.trim() ? {content: text, meta} : {content: text};
    fetch(`/api/user-notes/${CODE}`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const statusEl = document.getElementById('notesStatus');
    if (statusEl) statusEl.textContent = '已自動儲存 ' + new Date().toLocaleTimeString('zh-TW');
  }, 500);
}

function onNotesInput() {
  const statusEl = document.getElementById('notesStatus');
  if (statusEl) statusEl.textContent = '編輯中...';
  clearTimeout(_notesTimer);
  _notesTimer = setTimeout(() => {
    const text = document.getElementById('notesArea').value;
    if (text.trim()) {
      localStorage.setItem('notes_' + CODE, text);
      // 同步到 DB（帶結構化欄位）
      const meta = _collectMeta();
      fetch(`/api/user-notes/${CODE}`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({content: text, meta})
      });
    } else {
      localStorage.removeItem('notes_' + CODE);
      fetch(`/api/user-notes/${CODE}`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({content: ''})
      });
    }
    if (statusEl) statusEl.textContent = '已自動儲存 ' + new Date().toLocaleTimeString('zh-TW');
  }, 800);
}

async function loadReport() {
  const panel = document.getElementById('panel');
  panel.innerHTML = '<div class="loading"><div class="spinner"></div><div>載入投資報告書...</div></div>';
  try {
    const res = await fetch(`/api/investment-report/${CODE}`);
    const data = await res.json();
    const content = data.content || '';
    const updatedAt = data.updated_at || '';
    // 保鮮資料
    window._reportSnapshot = {
      price: data.snapshot_price, grade: data.snapshot_grade,
      eps: data.snapshot_eps, judgment: data.snapshot_judgment
    };

    // 保鮮指示器
    let freshnessHtml = '';
    if (updatedAt) {
      const daysSince = Math.floor((Date.now() - new Date(updatedAt).getTime()) / 86400000);
      const fColor = daysSince < 90 ? '#22c55e' : daysSince < 180 ? '#f59e0b' : '#ef4444';
      const fLabel = daysSince < 90 ? '新鮮' : daysSince < 180 ? '偏舊' : '過期';
      let priceWarn = '';
      if (data.snapshot_price && window._stockData?.close) {
        const pctChg = ((window._stockData.close - data.snapshot_price) / data.snapshot_price * 100).toFixed(1);
        const absChg = Math.abs(parseFloat(pctChg));
        if (absChg > 15) {
          priceWarn = `<span style="color:#ef4444;font-weight:600;margin-left:8px">股價偏離 ${pctChg}% 建議更新</span>`;
        } else {
          priceWarn = `<span style="margin-left:8px;color:#64748b">股價 ${data.snapshot_price} → ${window._stockData.close} (${pctChg > 0 ? '+' : ''}${pctChg}%)</span>`;
        }
      }
      freshnessHtml = `
        <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:10px;font-size:.8rem;flex-wrap:wrap">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${fColor}"></span>
          <span style="color:${fColor};font-weight:600">${fLabel}</span>
          <span style="color:#64748b">${daysSince} 天前</span>
          ${data.snapshot_judgment ? `<span style="padding:1px 8px;background:#eff6ff;border-radius:4px;color:#1e40af;font-weight:600">${data.snapshot_judgment}</span>` : ''}
          ${data.snapshot_grade ? `<span style="color:#64748b">等級 ${data.snapshot_grade}</span>` : ''}
          ${priceWarn}
        </div>`;
    }

    const name = document.querySelector('.chk-price')?.textContent?.split(' ')[1] || '';

    panel.innerHTML = `
      <div style="padding:16px 0">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
          <span style="font-size:1rem;font-weight:700;color:#1e3a5f">投資報告書</span>
          <button class="notes-mode-btn active" id="btnReportPreview" onclick="switchReportMode('preview')">預覽</button>
          <button class="notes-mode-btn" id="btnReportEdit" onclick="switchReportMode('edit')">編輯</button>
          <button onclick="copyReportContent()" style="padding:3px 10px;border:1px solid #334155;border-radius:5px;background:#fff;cursor:pointer;font-size:.75rem;color:#334155;font-weight:600">複製內容</button>
          <button onclick="copyReportPrompt()" style="padding:3px 10px;border:1px solid #059669;border-radius:5px;background:#fff;cursor:pointer;font-size:.75rem;color:#059669;font-weight:600">複製報告指令</button>
          <button onclick="exportReportPDF()" style="padding:3px 10px;border:1px solid #2563eb;border-radius:5px;background:#fff;cursor:pointer;font-size:.75rem;color:#2563eb;font-weight:600">匯出 PDF</button>
          <span id="reportStatus" style="font-size:.75rem;color:#94a3b8">${updatedAt ? '最後更新：' + updatedAt : ''}</span>
        </div>
        ${freshnessHtml}
        <div class="notes-preview" id="reportPreview"></div>
        <textarea id="reportArea" oninput="onReportInput()" style="display:none;width:100%;min-height:400px;border:1px solid #e2e8f0;border-radius:8px;padding:12px;font-size:.85rem;font-family:'Microsoft JhengHei','Segoe UI',monospace;resize:vertical;line-height:1.6">${content.replace(/</g,'&lt;')}</textarea>
      </div>`;

    _renderReportPreview();
  } catch(e) {
    panel.innerHTML = '<div class="loading" style="color:#ef4444">載入失敗: ' + e.message + '</div>';
  }
}

function copyReportContent() {
  const textarea = document.getElementById('reportArea');
  const text = textarea ? textarea.value : '';
  if (!text.trim()) { alert('報告內容為空'); return; }
  navigator.clipboard.writeText(text).then(() => {
    const el = document.getElementById('reportStatus');
    if (el) { const orig = el.textContent; el.textContent = '已複製到剪貼簿'; setTimeout(() => el.textContent = orig, 2000); }
  });
}

function switchReportMode(mode) {
  const textarea = document.getElementById('reportArea');
  const preview = document.getElementById('reportPreview');
  const btnEdit = document.getElementById('btnReportEdit');
  const btnPreview = document.getElementById('btnReportPreview');
  if (mode === 'edit') {
    textarea.style.display = '';
    preview.style.display = 'none';
    btnEdit.classList.add('active');
    btnPreview.classList.remove('active');
    textarea.focus();
  } else {
    const text = textarea.value || '';
    if (text.trim()) {
      preview.innerHTML = typeof marked !== 'undefined' ? marked.parse(text) : text.replace(/\n/g, '<br>');
    } else {
      preview.innerHTML = '<span style="color:#cbd5e1">無報告內容，點擊編輯</span>';
    }
    textarea.style.display = 'none';
    preview.style.display = '';
    btnPreview.classList.add('active');
    btnEdit.classList.remove('active');
  }
}

function _renderReportPreview() {
  const textarea = document.getElementById('reportArea');
  const preview = document.getElementById('reportPreview');
  if (!textarea || !preview) return;
  const text = textarea.value || '';
  if (text.trim()) {
    preview.innerHTML = typeof marked !== 'undefined' ? marked.parse(text) : text.replace(/\n/g, '<br>');
  } else {
    preview.innerHTML = '<span style="color:#cbd5e1">無報告內容，點擊編輯</span>';
  }
}

function onReportInput() {
  const statusEl = document.getElementById('reportStatus');
  if (statusEl) statusEl.textContent = '編輯中...';
  clearTimeout(_reportTimer);
  _reportTimer = setTimeout(() => {
    const text = document.getElementById('reportArea').value;
    fetch(`/api/investment-report/${CODE}`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({content: text})
    }).then(() => {
      // 儲存報告時自動更新快照
      if (text.trim() && window._stockData) {
        const s = window._stockData;
        fetch(`/api/report-snapshot/${CODE}`, {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            price: s.close, grade: s.val_level,
            eps: s.blend_eps || s.shen_eps,
            judgment: _extractJudgment(text)
          })
        });
      }
    });
    if (statusEl) statusEl.textContent = '已自動儲存 ' + new Date().toLocaleTimeString('zh-TW');
  }, 800);
}

function _extractJudgment(text) {
  // 從報告內容提取投資判斷（重倉/小買/觀望/避開）
  const m = text.match(/投資判斷[：:]\s*[【\[]?(重倉|小買|觀望|避開)[】\]]?/);
  return m ? m[1] : '';
}

function parseNum(id) {
  const v = document.getElementById(id).value.replace(/,/g, '').trim();
  return v === '' ? null : parseFloat(v);
}

function fmtNum(v, dec) {
  if (v == null || isNaN(v)) return '-';
  return v.toLocaleString('zh-TW', {minimumFractionDigits: dec, maximumFractionDigits: dec});
}

function calcEstimate() {
  const r1 = parseNum('estRev1');
  const r2 = parseNum('estRev2');
  const r3 = parseNum('estRev3');
  const gm = parseNum('estGM');
  const opex = parseNum('estOpex');
  const nonop = parseNum('estNonOp');
  const taxRate = parseNum('estTax');
  const pw = parseNum('estPW');

  // 累計營收
  const parts = [r1, r2, r3].filter(v => v != null);
  const cumK = parts.length > 0 ? parts.reduce((a, b) => a + b, 0) : null;
  const cumM = cumK != null ? cumK / 1000 : null;
  document.getElementById('estCumRevK').textContent = fmtNum(cumK, 0);
  document.getElementById('estCumRevM').textContent = fmtNum(cumM, 2);

  // 毛利 = 累計營收(百萬) * 毛利率%
  const gp = (cumM != null && gm != null) ? cumM * gm / 100 : null;
  document.getElementById('estGP').textContent = fmtNum(gp, 2);

  // 營業成本 = 累計營收(百萬) - 毛利
  const cogs = (cumM != null && gp != null) ? cumM - gp : null;
  document.getElementById('estCOGS').textContent = fmtNum(cogs, 2);

  // 營業利益 = 毛利 - 費用(百萬)
  const oi = (gp != null && opex != null) ? gp - opex : null;
  document.getElementById('estOI').textContent = fmtNum(oi, 2);

  // 營益率
  const oir = (oi != null && cumM && cumM !== 0) ? oi / cumM * 100 : null;
  document.getElementById('estOIR').textContent = fmtNum(oir, 2);

  // 稅前淨利
  const pti = (oi != null && nonop != null) ? oi + nonop : null;
  document.getElementById('estPTI').textContent = fmtNum(pti, 2);

  // 稅前淨利率
  const ptir = (pti != null && cumM && cumM !== 0) ? pti / cumM * 100 : null;
  document.getElementById('estPTIR').textContent = fmtNum(ptir, 2);

  // 稅
  const taxAmt = (pti != null && taxRate != null) ? pti * taxRate / 100 : null;
  document.getElementById('estTaxAmt').textContent = fmtNum(taxAmt, 2);

  // 稅後淨利
  const ni = (pti != null && taxRate != null) ? pti * (1 - taxRate / 100) : null;

  // 稅後淨利率
  const nir = (ni != null && cumM && cumM !== 0) ? ni / cumM * 100 : null;
  document.getElementById('estNIR').textContent = fmtNum(nir, 2);

  // 歸屬母公司淨利
  const nip = (ni != null && pw != null) ? ni * pw / 100 : null;
  document.getElementById('estNIP').textContent = fmtNum(nip, 2);

  // 估計 EPS
  const eps = (nip != null && _estSharesMillion && _estSharesMillion !== 0) ? nip / _estSharesMillion : null;
  document.getElementById('estEPS').textContent = fmtNum(eps, 2);

  // EPS-本業 = 營業利益 * (1-稅率) * 歸屬權重 / 股數
  const epsCore = (oi != null && taxRate != null && pw != null && _estSharesMillion) ? oi * (1 - taxRate / 100) * pw / 100 / _estSharesMillion : null;
  document.getElementById('estEPScore').textContent = fmtNum(epsCore, 2);

  // EPS-業外 = EPS - EPS本業
  const epsNonop = (eps != null && epsCore != null) ? eps - epsCore : null;
  document.getElementById('estEPSnonop').textContent = fmtNum(epsNonop, 2);
}

function calcEstimateYear() {
  const rev = parseNum('estRevYear');
  const gr = parseNum('estGrowthRate');
  const gm = parseNum('estGMYear');
  const opex = parseNum('estOpexYear');
  const nonop = parseNum('estNonOpYear');
  const taxRate = parseNum('estTaxYear');
  const pw = parseNum('estPWYear');

  // 累計營收 = 自訂營收 * (1 + 成長率%)
  const cumK = (rev != null && gr != null) ? rev * (1 + gr / 100) : (rev != null ? rev : null);
  const cumM = cumK != null ? cumK / 1000 : null;
  document.getElementById('estCumRevKYear').textContent = fmtNum(cumK, 0);
  document.getElementById('estCumRevMYear').textContent = fmtNum(cumM, 2);

  // 毛利 = 累計營收(百萬) * 毛利率%
  const gp = (cumM != null && gm != null) ? cumM * gm / 100 : null;
  document.getElementById('estGPYear').textContent = fmtNum(gp, 2);

  // 營業成本 = 累計營收(百萬) - 毛利
  const cogs = (cumM != null && gp != null) ? cumM - gp : null;
  document.getElementById('estCOGSYear').textContent = fmtNum(cogs, 2);

  // 營業利益 = 毛利 - 費用(百萬)
  const oi = (gp != null && opex != null) ? gp - opex : null;
  document.getElementById('estOIYear').textContent = fmtNum(oi, 2);

  const oir = (oi != null && cumM && cumM !== 0) ? oi / cumM * 100 : null;
  document.getElementById('estOIRYear').textContent = fmtNum(oir, 2);

  const pti = (oi != null && nonop != null) ? oi + nonop : null;
  document.getElementById('estPTIYear').textContent = fmtNum(pti, 2);

  const ptir = (pti != null && cumM && cumM !== 0) ? pti / cumM * 100 : null;
  document.getElementById('estPTIRYear').textContent = fmtNum(ptir, 2);

  const taxAmt = (pti != null && taxRate != null) ? pti * taxRate / 100 : null;
  document.getElementById('estTaxAmtYear').textContent = fmtNum(taxAmt, 2);

  const ni = (pti != null && taxRate != null) ? pti * (1 - taxRate / 100) : null;
  const nir = (ni != null && cumM && cumM !== 0) ? ni / cumM * 100 : null;
  document.getElementById('estNIRYear').textContent = fmtNum(nir, 2);

  const nip = (ni != null && pw != null) ? ni * pw / 100 : null;
  document.getElementById('estNIPYear').textContent = fmtNum(nip, 2);

  const eps = (nip != null && _estSharesMillion && _estSharesMillion !== 0) ? nip / _estSharesMillion : null;
  document.getElementById('estEPSYear').textContent = fmtNum(eps, 2);

  // EPS-本業 = 營業利益 * (1-稅率) * 歸屬權重 / 股數
  const epsCore = (oi != null && taxRate != null && pw != null && _estSharesMillion) ? oi * (1 - taxRate / 100) * pw / 100 / _estSharesMillion : null;
  document.getElementById('estEPScoreYear').textContent = fmtNum(epsCore, 2);

  const epsNonop = (eps != null && epsCore != null) ? eps - epsCore : null;
  document.getElementById('estEPSnonopYear').textContent = fmtNum(epsNonop, 2);
}

// ── 年度 EPS 彙總 ──
function calcAnnual() {
  const q1 = parseNum('estQ1');
  const q2 = parseNum('estQ2');
  const q3 = parseNum('estQ3');
  const q4 = parseNum('estQ4');
  const parts = [q1, q2, q3, q4].filter(v => v != null);
  const annEps = parts.length > 0 ? parts.reduce((a, b) => a + b, 0) : null;
  document.getElementById('annEPS').textContent = fmtNum(annEps, 2);
  calcValuation(annEps);
  _syncToValMethod();
}

function calcFromPR() {
  const q1 = parseNum('estQ1'), q2 = parseNum('estQ2'), q3 = parseNum('estQ3'), q4 = parseNum('estQ4');
  const parts = [q1, q2, q3, q4].filter(v => v != null);
  const annEps = parts.length > 0 ? parts.reduce((a, b) => a + b, 0) : null;
  const pr = parseNum('annPR');
  if (annEps != null && pr != null) {
    document.getElementById('annDiv').value = (annEps * pr / 100).toFixed(2);
  }
  calcValuation(annEps);
  calcYldRange();
  _syncToValMethod();
}

function calcFromDiv() {
  const q1 = parseNum('estQ1'), q2 = parseNum('estQ2'), q3 = parseNum('estQ3'), q4 = parseNum('estQ4');
  const parts = [q1, q2, q3, q4].filter(v => v != null);
  const annEps = parts.length > 0 ? parts.reduce((a, b) => a + b, 0) : null;
  const div = parseNum('annDiv');
  if (annEps != null && annEps !== 0 && div != null) {
    document.getElementById('annPR').value = (div / annEps * 100).toFixed(2);
  }
  calcValuation(annEps);
  calcYldRange();
  _syncToValMethod();
}

function calcValuation(annEps) {
  const div = parseNum('annDiv');
  // 本益比
  const pe = (annEps && annEps !== 0 && _estPrice) ? _estPrice / annEps : null;
  document.getElementById('annPE').textContent = pe != null ? pe.toFixed(2) : '-';
  // 殖利率
  const yld = (div && _estPrice && _estPrice !== 0) ? div / _estPrice * 100 : null;
  document.getElementById('annYield').textContent = yld != null ? yld.toFixed(2) + '%' : '-';
  renderMatrix();
  calcNeff();
}

function calcNeff() {
  const peText = document.getElementById('annPE').textContent;
  const yldText = document.getElementById('annYield').textContent;
  const pe = peText !== '-' ? parseFloat(peText) : null;
  const yld = yldText !== '-' ? parseFloat(yldText) : null;
  const growth = parseFloat(document.getElementById('neffGrowth').value);

  document.getElementById('neffPE').textContent = pe != null ? pe.toFixed(2) : '-';
  document.getElementById('neffYld').textContent = yld != null ? yld.toFixed(2) + '%' : '-';

  const resultEl = document.getElementById('neffResult');
  const noteEl = document.getElementById('neffNote');

  if (isNaN(growth) || pe == null || yld == null) {
    resultEl.textContent = '-';
    resultEl.style.color = '#334155';
    noteEl.textContent = '';
  } else {
    const totalReturn = growth + yld;
    if (totalReturn <= 0 || pe <= 0) {
      resultEl.textContent = '無意義';
      resultEl.style.color = '#94a3b8';
      noteEl.textContent = `總報酬率 = ${growth.toFixed(2)}% + ${yld.toFixed(2)}% = ${totalReturn.toFixed(2)}%（≤ 0，無法計算）`;
    } else {
      const neff = totalReturn / pe;
      resultEl.textContent = neff.toFixed(2);
      resultEl.style.color = neff >= 0.7 ? '#dc2626' : '#64748b';
      noteEl.textContent = `(自訂成長率 ${growth.toFixed(2)}% + 預估殖利率 ${yld.toFixed(2)}%) / 預估PE ${pe.toFixed(2)} = ${neff.toFixed(2)}` +
        (neff >= 1.0 ? '　極具吸引力' : neff >= 0.7 ? '　具吸引力' : '　未達門檻');
    }
  }
  _updateNeffRef();
}
function _updateNeffRef() {
  const el = document.getElementById('neffRefNote');
  if (!el) return;
  const cumYoy = _stockData ? _stockData.revenue_cum_yoy : null;
  const cumStr = cumYoy != null ? (cumYoy >= 0 ? '+' : '') + cumYoy.toFixed(1) + '%' : '-';
  let suggestG = '-';
  if (cumYoy != null) {
    if (cumYoy < 0) suggestG = '3';
    else if (cumYoy < 10) suggestG = '5';
    else if (cumYoy < 20) suggestG = '8';
    else if (cumYoy < 30) suggestG = '10';
    else suggestG = '12';
  }
  el.innerHTML = `<span style="color:#b45309;font-weight:600">目前累積營收YoY：${cumStr}</span>` +
    `<span style="margin-left:12px">→ 建議 g = ${suggestG}%</span>` +
    `<br><span style="color:#aab">對照表：&lt;0%→3 ｜ 0~10%→5 ｜ 10~20%→8 ｜ 20~30%→10 ｜ &gt;30%→12（天花板） ｜ 護城河龍頭特例→15（上限）</span>`;
}

function _updateSysValLabels() {
  const _set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  // 用全域設定值（不受個股自訂覆蓋）
  const gHi = _gvGlobal.peHigh, gLo = _gvGlobal.peLow;
  const gYH = _gvGlobal.yldHigh, gYM = _gvGlobal.yldMax;
  const peFair = (gHi + gLo) / 2;
  const peAbove = (gHi + peFair) / 2;
  const peBelow = (peFair + gLo) / 2;
  _set('sysPeHigh', gHi);
  _set('sysPeLow', gLo);
  _set('sysPeAboveVal', peAbove);
  _set('sysPeFairVal', peFair);
  _set('sysPeBelowVal', peBelow);
  _set('sysYldHigh', gYH + '%');
  _set('sysYldMax', gYM + '%');
  const yFair = (gYH + gYM) / 2;
  _set('sysYldFairVal', yFair.toFixed(2) + '%');
  // 價格：用年度估算的 EPS/股利
  if (_sysAnnual && !_sysAnnual.error) {
    const eps = _sysAnnual.est_eps;
    const div = _sysAnnual.details && _sysAnnual.details.est_div;
    if (eps > 0) {
      _set('sysPriceAbove', (eps * peAbove).toFixed(2));
      _set('sysPriceFair', (eps * peFair).toFixed(2));
      _set('sysPriceBelow', (eps * peBelow).toFixed(2));
    }
    if (div > 0) {
      _set('sysYldPriceHigh', (div / gYH * 100).toFixed(2));
      _set('sysYldPriceFair', (div / yFair * 100).toFixed(2));
      _set('sysYldPriceMax', (div / gYM * 100).toFixed(2));
    }
  }
}

function calcPERange() {
  const hi = parseNum('peHigh') || _peHi;
  const lo = parseNum('peLow') || _peLo;
  const fair  = (hi != null && lo != null) ? (hi + lo) / 2 : null;
  const above = (hi != null && fair != null) ? (hi + fair) / 2 : null;
  const below = (fair != null && lo != null) ? (fair + lo) / 2 : null;

  document.getElementById('peAbove').textContent = fmtNum(above, 2);
  document.getElementById('peFair').textContent  = fmtNum(fair, 2);
  document.getElementById('peBelow').textContent = fmtNum(below, 2);

  // 搭配預估 EPS 計算對應價格
  const q1 = parseNum('estQ1'), q2 = parseNum('estQ2'), q3 = parseNum('estQ3'), q4 = parseNum('estQ4');
  const parts = [q1, q2, q3, q4].filter(v => v != null);
  const annEps = parts.length > 0 ? parts.reduce((a, b) => a + b, 0) : null;

  document.getElementById('priceAbove').textContent = (above != null && annEps) ? fmtNum(above * annEps, 2) : '-';
  document.getElementById('priceFair').textContent  = (fair != null && annEps)  ? fmtNum(fair * annEps, 2) : '-';
  document.getElementById('priceBelow').textContent = (below != null && annEps) ? fmtNum(below * annEps, 2) : '-';
  renderMatrix();
}

function calcYldRange() {
  const yHigh = parseNum('yldHigh') || _yHigh;
  const yMax  = parseNum('yldMax') || _yMax;
  const yFair = (yHigh != null && yMax != null) ? (yHigh + yMax) / 2 : null;
  document.getElementById('yldFair').textContent = yFair != null ? yFair.toFixed(2) + '%' : '-';

  const div = parseNum('annDiv');
  document.getElementById('yldPriceHigh').textContent = (div && yHigh) ? fmtNum(div / yHigh * 100, 2) : '-';
  document.getElementById('yldPriceFair').textContent = (div && yFair) ? fmtNum(div / yFair * 100, 2) : '-';
  document.getElementById('yldPriceMax').textContent  = (div && yMax)  ? fmtNum(div / yMax * 100, 2) : '-';
  renderMatrix();
}

function _buildSysGradeBadge() {
  if (!_sysAnnual || !_sysAnnual.details) return '';
  const sa = _sysAnnual.details;
  const sPE = sa.est_pe, sYld = sa.est_yld;
  if (sPE == null || sYld == null) return '';

  // 使用自訂參數（與使用者等級一致）
  const peHi = parseNum('peHigh') || _peHi;
  const peLo = parseNum('peLow') || _peLo;
  const yHigh = parseNum('yldHigh') || _yHigh;
  const yMax  = parseNum('yldMax') || _yMax;
  const yFloor = _yldFloor;

  const peFair  = (peHi + peLo) / 2;
  const peAbove = (peHi + peFair) / 2;
  const peBelow = (peFair + peLo) / 2;

  const grades = [['AA','A2','B2A','觀察','臨界點','X'],['A1','A','B2','臨界點','X','X'],['B1A','B1','臨界點','X','X','X'],['觀察','臨界點','X','X','X','X']];
  const sPeCols = [{lo:-Infinity,hi:peLo},{lo:peLo,hi:peBelow},{lo:peBelow,hi:peFair},{lo:peFair,hi:peAbove},{lo:peAbove,hi:peHi},{lo:peHi,hi:Infinity}];
  const sYRows = [{lo:yMax,hi:Infinity},{lo:yHigh,hi:yMax},{lo:yFloor,hi:yHigh},{lo:-Infinity,hi:yFloor}];
  const sRow = sYRows.findIndex(r => sYld >= r.lo && sYld < r.hi);
  const sCol = sPeCols.findIndex(c => sPE >= c.lo && sPE < c.hi);
  if (sRow < 0 || sCol < 0) return '';
  const sg = grades[sRow][sCol];
  const sBadge = sg === 'AA' ? 'gb-aa' : (sg==='A'||sg==='A1'||sg==='A2') ? 'gb-a' : (sg==='B1A'||sg==='B2A') ? 'gb-ba' : (sg==='B1'||sg==='B2') ? 'gb-b' : sg==='觀察' ? 'gb-watch' : sg==='臨界點' ? 'gb-crit' : 'gb-x';
  return `<div><div class="grade-badge ${sBadge}"><span class="grade-label">系統評估等級：</span>${sg}</div>`
    + `<div style="margin-top:4px;font-size:.82rem;color:#0369a1">系統本益比 ${sPE.toFixed(2)} / 系統殖利率 ${sYld}%</div></div>`;
}

function renderMatrix() {
  const el = document.getElementById('matrixContainer');
  if (!el) return;

  // 優先自訂，fallback 預設
  const peHi = parseNum('peHigh') || _peHi;
  const peLo = parseNum('peLow') || _peLo;
  const yHigh = parseNum('yldHigh') || _yHigh;
  const yMax  = parseNum('yldMax') || _yMax;

  const peFair  = (peHi + peLo) / 2;
  const peAbove = (peHi + peFair) / 2;
  const peBelow = (peFair + peLo) / 2;
  const yFloor  = _yldFloor;

  // PE 區間（左→右，由小到大）
  const peCols = [
    { label: `< ${peLo.toFixed(1)}`, lo: -Infinity, hi: peLo },
    { label: `${peLo.toFixed(1)}~${peBelow.toFixed(1)}`, lo: peLo, hi: peBelow },
    { label: `${peBelow.toFixed(1)}~${peFair.toFixed(1)}`, lo: peBelow, hi: peFair },
    { label: `${peFair.toFixed(1)}~${peAbove.toFixed(1)}`, lo: peFair, hi: peAbove },
    { label: `${peAbove.toFixed(1)}~${peHi.toFixed(1)}`, lo: peAbove, hi: peHi },
    { label: `> ${peHi.toFixed(1)}`, lo: peHi, hi: Infinity },
  ];

  // 殖利率區間（上→下，由高到低）
  const yRows = [
    { label: `> ${yMax}%（最高）`, lo: yMax, hi: Infinity },
    { label: `${yHigh}%~${yMax}%（偏高~最高）`, lo: yHigh, hi: yMax },
    { label: `${yFloor}%~${yHigh}%（下限~偏高）`, lo: yFloor, hi: yHigh },
    { label: `< ${yFloor}%（低於下限）`, lo: -Infinity, hi: yFloor },
  ];

  // 矩陣評級（行=殖利率由高到低，列=本益比由低到高）
  const grades = [
    ['AA','A2','B2A','觀察','臨界點','X'],
    ['A1','A','B2','臨界點','X','X'],
    ['B1A','B1','臨界點','X','X','X'],
    ['觀察','臨界點','X','X','X','X'],
  ];
  const gradeClass = g => {
    if (g === 'AA') return 'g-aa';
    if (g === 'A' || g === 'A1' || g === 'A2') return 'g-a';
    if (g === 'B1A' || g === 'B2A') return 'g-ba';
    if (g === 'B1' || g === 'B2') return 'g-b';
    if (g === '觀察') return 'g-watch';
    if (g === '臨界點') return 'g-crit';
    return 'g-x';
  };

  // 計算目前位置
  const q1 = parseNum('estQ1'), q2 = parseNum('estQ2'), q3 = parseNum('estQ3'), q4 = parseNum('estQ4');
  const parts = [q1, q2, q3, q4].filter(v => v != null);
  const annEps = parts.length > 0 ? parts.reduce((a, b) => a + b, 0) : null;
  const curPE  = (annEps && annEps > 0 && _estPrice) ? _estPrice / annEps : null;
  const curDiv = parseNum('annDiv');
  const curYld = (curDiv && _estPrice && _estPrice > 0) ? curDiv / _estPrice * 100 : null;

  let curRow = -1, curCol = -1;
  if (curPE != null) { curCol = peCols.findIndex(c => curPE >= c.lo && curPE < c.hi); }
  if (curYld != null) { curRow = yRows.findIndex(r => curYld >= r.lo && curYld < r.hi); }

  // 等級 badge（左：使用者，右：系統）
  const gradeEl = document.getElementById('matrixGrade');
  let gradeHtml = '<div>';
  if (curRow >= 0 && curCol >= 0) {
    const g = grades[curRow][curCol];
    const badgeCls = g === 'AA' ? 'gb-aa' : (g==='A'||g==='A1'||g==='A2') ? 'gb-a'
      : (g==='B1A'||g==='B2A') ? 'gb-ba' : (g==='B1'||g==='B2') ? 'gb-b'
      : g==='觀察' ? 'gb-watch' : g==='臨界點' ? 'gb-crit' : 'gb-x';
    const peStr = curPE != null ? curPE.toFixed(2) : '-';
    const yldStr = curYld != null ? curYld.toFixed(2) + '%' : '-';
    gradeHtml += `<div class="grade-badge ${badgeCls}"><span class="grade-label">價值評估矩陣等級：</span>${g}</div>`
      + `<div style="margin-top:4px;font-size:.82rem;color:#64748b">本益比 ${peStr} / 殖利率 ${yldStr}</div>`;
  } else {
    gradeHtml += '<div class="grade-badge gb-na"><span class="grade-label">價值評估矩陣等級：</span>尚未計算</div>';
  }
  gradeHtml += '</div>';
  gradeHtml += _buildSysGradeBadge();
  gradeEl.innerHTML = gradeHtml;

  // 渲染表格
  let html = '<table class="vm-table"><thead><tr><th>殖利率 \\ 本益比</th>';
  peCols.forEach(c => html += `<th>${c.label}</th>`);
  html += '</tr></thead><tbody>';

  for (let ri = 0; ri < yRows.length; ri++) {
    html += `<tr><th>${yRows[ri].label}</th>`;
    for (let ci = 0; ci < peCols.length; ci++) {
      const g = grades[ri][ci];
      const isCur = (ri === curRow && ci === curCol);
      html += `<td class="${gradeClass(g)}${isCur ? ' g-cur' : ''}">${g}</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  el.innerHTML = html;
}

async function loadPEHistory() {
  const el = document.getElementById('peHistoryContainer');
  if (!el) return;
  try {
    const res = await fetch(`/api/stocks/${CODE}/pe-history`);
    const json = await res.json();
    if (!json.data || !json.data.length) {
      el.innerHTML = '<div style="color:#94a3b8;font-size:.85rem;padding:8px 0">無歷史本益比資料</div>';
      return;
    }
    renderPEHistory(json.data, json.estimate);
  } catch(e) {
    el.innerHTML = '<div style="color:#ef4444;font-size:.85rem">載入失敗</div>';
  }
}

  data.forEach(d => html += `<td class="pe-low">${d.pe_low.toFixed(1)}</td>`);

    html += `<div class="est-chip" onclick="applyPE(${est.median_high},${est.median_low})">
      <span class="est-chip-label">中位數</span><span class="pe-high">${est.median_high}</span><span class="arrow">/</span><span class="pe-low">${est.median_low}</span></div>`;

    }
    html += '</div>';
  }

  el.innerHTML = html;
}

function applyPE(high, low) {
  document.getElementById('peHigh').value = high;
  document.getElementById('peLow').value = low;
  calcPERange();
}

function calcDDM() {
  if (!document.getElementById('ddmSell')) return;

  const eps = parseNum('ddmEps');
  const pe = parseNum('ddmPE');
  const rate = parseNum('ddmRate');
  const margin = parseNum('ddmMargin');

  const div1 = parseNum('ddmDiv1');
  const div2 = parseNum('ddmDiv2');
  const div3 = parseNum('ddmDiv3');

  const f = (v) => v != null && !isNaN(v) ? v.toFixed(2) : '-';
  const f4 = (v) => v != null && !isNaN(v) ? v.toFixed(4) : '-';
  const fPct = (v) => v != null && !isNaN(v) ? (v * 100).toFixed(2) + '%' : '-';
  const setCell = (id, text, css) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = text;
    el.className = css || '';
  };

  if (!eps || !pe || !rate || !margin) {
    ['ddmSell','ddmDf1','ddmDf2','ddmDf3','ddmPv1','ddmPv2','ddmPv3',
     'ddmIntrinsic','ddmRetI','ddmAnnI','ddmTarget1',
     'ddmSafe','ddmRetS','ddmAnnS','ddmTarget2',
     'ddmCur','ddmRetC','ddmAnnC','ddmTarget3'].forEach(id => setCell(id, '-'));
    return;
  }

  const curPrice = _estPrice || 0;
  const sellPrice = eps * pe;

  const df1 = 1 / Math.pow(1 + rate, 1);
  const df2 = 1 / Math.pow(1 + rate, 2);
  const df3 = 1 / Math.pow(1 + rate, 3);

  const pv1 = (0 + (div1 || 0)) * df1;
  const pv2 = (0 + (div2 || 0)) * df2;
  const pv3 = (sellPrice + (div3 || 0)) * df3;

  const intrinsic = pv1 + pv2 + pv3;
  const safePrice = intrinsic * margin;

  const totalDiv = (div1 || 0) + (div2 || 0) + (div3 || 0);
  const targetPrice = sellPrice + totalDiv;

  const calcReturn = (base) => {
    if (!base || base <= 0) return { ret: null, annRet: null };
    const ret = (targetPrice - base) / base;
    const annRet = Math.pow(1 + ret, 1/3) - 1;
    return { ret, annRet };
  };

  const rI = calcReturn(intrinsic);
  const rS = calcReturn(safePrice);
  const rC = calcReturn(curPrice);

  const clsR = (v) => v != null && v > 0 ? 'safe' : (v != null && v < 0 ? 'danger' : '');

  setCell('ddmSell', f(sellPrice), 'highlight');
  setCell('ddmDf1', f4(df1)); setCell('ddmDf2', f4(df2)); setCell('ddmDf3', f4(df3));
  setCell('ddmPv1', f(pv1)); setCell('ddmPv2', f(pv2)); setCell('ddmPv3', f(pv3));

  setCell('ddmIntrinsic', f(intrinsic), 'highlight');
  setCell('ddmRetI', fPct(rI.ret), clsR(rI.ret));
  setCell('ddmAnnI', fPct(rI.annRet), clsR(rI.annRet));
  setCell('ddmTarget1', f(targetPrice), 'highlight');

  setCell('ddmSafe', f(safePrice), 'highlight');
  setCell('ddmRetS', fPct(rS.ret), clsR(rS.ret));
  setCell('ddmAnnS', fPct(rS.annRet), clsR(rS.annRet));
  setCell('ddmTarget2', f(targetPrice));

  setCell('ddmCur', curPrice ? f(curPrice) : '-');
  setCell('ddmRetC', fPct(rC.ret), clsR(rC.ret));
  setCell('ddmAnnC', fPct(rC.annRet), clsR(rC.annRet));
  setCell('ddmTarget3', f(targetPrice));

  saveDDM();
}

let _dcfFcfData = [];  // 近5年 FCF 資料 [{year, fcf, fcf_per_share}]
let _dcfSharesMillion = null;  // 股數（百萬股）

async function initDCF() {
  // 從 financials API 取得近5年 FCF
  try {
    const res = await fetch(`/api/stocks/${CODE}/financials`);
    const json = await res.json();
    if (json.data && json.data.length) {
      _dcfFcfData = json.data
        .filter(d => d.fcf != null)
        .sort((a, b) => b.year - a.year)
        .slice(0, 5)
        .reverse();  // 由舊到新
      // 取最新一筆的 common_stock 算股數
      const latest = json.data.find(d => d.common_stock && d.common_stock > 0);
      if (latest) _dcfSharesMillion = latest.common_stock / 10 / 1000000;  // 股本(元)/10=股數, /1M=百萬股
    }
  } catch(e) { console.warn('[DCF] 無法取得財報:', e); }

  // 顯示近5年 FCF 歷史
  renderDCFFcfHistory();

  // 顯示股數
  const sharesInfo = document.getElementById('dcfSharesInfo');
  if (sharesInfo && _dcfSharesMillion) {
    const totalShares = _dcfSharesMillion * 1000000;
    const display = totalShares >= 1e8
      ? (totalShares / 1e8).toFixed(2) + ' 億股'
      : totalShares.toLocaleString() + ' 股';
    sharesInfo.textContent = `股數：${display}`;
  }

  // 計算近5年 FCF 中位數作為預設值
  if (_dcfFcfData.length > 0) {
    const fcfValues = _dcfFcfData.map(d => d.fcf).filter(v => v > 0);
    if (fcfValues.length > 0) {
      fcfValues.sort((a, b) => a - b);
      const mid = Math.floor(fcfValues.length / 2);
      const median = fcfValues.length % 2 === 0
        ? (fcfValues[mid - 1] + fcfValues[mid]) / 2
        : fcfValues[mid];
      const medianM = median / 1000000;  // 轉百萬
      const fcfInput = document.getElementById('dcfFcf');
      if (fcfInput && !fcfInput.value) {
        fcfInput.value = medianM.toFixed(0);
        fcfInput.placeholder = medianM.toFixed(0);
      }
    }
  }

  // 載入已儲存參數
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('estimate_' + CODE) || '{}'); } catch(e) {}
  if (saved.dcfFcf) document.getElementById('dcfFcf').value = saved.dcfFcf;
  if (saved.dcfRate) document.getElementById('dcfRate').value = saved.dcfRate;
  if (saved.dcfGrowth) document.getElementById('dcfGrowth').value = saved.dcfGrowth;
  if (saved.dcfGrowthYears) document.getElementById('dcfGrowthYears').value = saved.dcfGrowthYears;
  if (saved.dcfTermGrowth) document.getElementById('dcfTermGrowth').value = saved.dcfTermGrowth;
  if (saved.dcfMargin) document.getElementById('dcfMargin').value = saved.dcfMargin;

  calcDCF();
}

function renderDCFFcfHistory() {
  const container = document.getElementById('dcfFcfHistory');
  if (!container || _dcfFcfData.length === 0) return;

  const fmtM = v => v != null ? (v / 1000000).toFixed(0) : '-';
  const fmtPS = v => v != null ? v.toFixed(2) : '-';

  let html = '<table class="dcf-fcf-table"><thead><tr><th>項目</th>';
  _dcfFcfData.forEach(d => html += `<th>${d.year - 1911}年</th>`);
  html += '<th>中位數</th></tr></thead><tbody>';

  // 自由現金流（百萬）
  const fcfMs = _dcfFcfData.map(d => d.fcf);
  const positiveFcfs = fcfMs.filter(v => v > 0);
  let medianFcf = null;
  if (positiveFcfs.length > 0) {
    const sorted = [...positiveFcfs].sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);
    medianFcf = sorted.length % 2 === 0 ? (sorted[mid-1] + sorted[mid]) / 2 : sorted[mid];
  }

  html += '<tr><td class="row-label">自由現金流(百萬)</td>';
  fcfMs.forEach(v => {
    const cls = v < 0 ? ' style="color:#dc2626"' : '';
    html += `<td${cls}>${fmtM(v)}</td>`;
  });
  html += `<td style="font-weight:700;color:#7c3aed">${medianFcf != null ? fmtM(medianFcf) : '-'}</td></tr>`;

  // 每股自由現金流
  html += '<tr><td class="row-label">每股自由現金流</td>';
  _dcfFcfData.forEach(d => {
    const v = d.fcf_per_share;
    const cls = v != null && v < 0 ? ' style="color:#dc2626"' : '';
    html += `<td${cls}>${fmtPS(v)}</td>`;
  });
  // 每股中位數
  const fcfPsValues = _dcfFcfData.map(d => d.fcf_per_share).filter(v => v != null && v > 0);
  let medianPs = null;
  if (fcfPsValues.length > 0) {
    const sorted = [...fcfPsValues].sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);
    medianPs = sorted.length % 2 === 0 ? (sorted[mid-1] + sorted[mid]) / 2 : sorted[mid];
  }
  html += `<td style="font-weight:700;color:#7c3aed">${medianPs != null ? fmtPS(medianPs) : '-'}</td></tr>`;

  html += '</tbody></table>';
  container.innerHTML = html;
}

function calcDCF() {
  const table = document.getElementById('dcfResultTable');
  const body = document.getElementById('dcfResultBody');
  const note = document.getElementById('dcfNote');
  if (!table || !body) return;

  const fcfM = parseNum('dcfFcf');  // 百萬元
  const rate = parseNum('dcfRate');  // %
  const growth = parseNum('dcfGrowth');  // %
  const growthYears = parseNum('dcfGrowthYears');
  const termGrowth = parseNum('dcfTermGrowth');  // %
  const margin = parseNum('dcfMargin');  // %

  if (!fcfM || !rate || rate <= 0 || growthYears == null || growthYears < 1 || margin == null) {
    table.style.display = 'none';
    if (note) note.textContent = '';
    return;
  }

  if (fcfM <= 0) {
    table.style.display = 'none';
    if (note) note.innerHTML = '<span style="color:#dc2626">自由現金流為負，無法進行 DCF 評估</span>';
    return;
  }

  const r = rate / 100;
  const g = (growth || 0) / 100;
  const tg = (termGrowth || 0) / 100;
  const mg = (margin || 80) / 100;
  const n = Math.round(growthYears);
  const fcf = fcfM * 1000000;  // 轉元

  // === 合理價值（用設定的成長率）===
  let pvTotal = 0;
  let cfYear = fcf;
  for (let i = 1; i <= n; i++) {
    cfYear = (i === 1) ? fcf * (1 + g) : cfYear * (1 + g);
    pvTotal += cfYear / Math.pow(1 + r, i);
  }
  // 終端價值
  const terminalCF = cfYear * (1 + tg);
  const terminalValue = terminalCF / (r - tg);
  const pvTerminal = terminalValue / Math.pow(1 + r, n);
  const totalValue = pvTotal + pvTerminal;

  // === 零成長價值（Pabrai 壓力測試）===
  let pvZero = 0;
  for (let i = 1; i <= n; i++) {
    pvZero += fcf / Math.pow(1 + r, i);
  }
  const terminalZero = fcf / r;  // 永續零成長
  const pvTerminalZero = terminalZero / Math.pow(1 + r, n);
  const totalZero = pvZero + pvTerminalZero;

  // 每股計算
  const shares = _dcfSharesMillion ? _dcfSharesMillion * 1000000 : null;
  const perShare = shares ? totalValue / shares : null;
  const perShareZero = shares ? totalZero / shares : null;
  const safePrice = perShare ? perShare * mg : null;
  const curPrice = _estPrice || 0;

  // 折價比
  const discountVsFair = (perShare && curPrice) ? (curPrice / perShare * 100) : null;
  const discountVsSafe = (safePrice && curPrice) ? (curPrice / safePrice * 100) : null;

  const f = v => v != null ? v.toFixed(2) : '-';
  const fM = v => v != null ? (v / 1000000).toLocaleString() + ' 百萬' : '-';

  let rows = '';
  rows += `<tr><td class="row-label">合理內在價值（總）</td><td>${fM(totalValue)}</td></tr>`;
  rows += `<tr><td class="row-label">合理內在價值（每股）</td><td class="highlight">${f(perShare)}</td></tr>`;
  rows += `<tr><td class="row-label">零成長價值（每股）</td><td>${f(perShareZero)}</td></tr>`;
  rows += `<tr><td class="row-label">安全邊際價（${(mg*100).toFixed(0)}%）</td><td class="highlight">${f(safePrice)}</td></tr>`;
  rows += `<tr><td class="row-label">現價</td><td>${curPrice ? f(curPrice) : '-'}</td></tr>`;

  if (discountVsFair != null) {
    const cls = discountVsFair <= 80 ? 'safe' : discountVsFair >= 100 ? 'danger' : '';
    rows += `<tr><td class="row-label">現價 / 合理價</td><td class="${cls}">${discountVsFair.toFixed(1)}%</td></tr>`;
  }
  if (discountVsSafe != null) {
    const cls = discountVsSafe <= 100 ? 'safe' : 'danger';
    rows += `<tr><td class="row-label">現價 / 安全邊際價</td><td class="${cls}">${discountVsSafe.toFixed(1)}%</td></tr>`;
  }

  body.innerHTML = rows;
  table.style.display = '';

  if (note) {
    const parts = [];
    parts.push(`FCF ${fcfM.toLocaleString()} 百萬`);
    parts.push(`成長 ${g*100}%×${n}年`);
    parts.push(`永續 ${tg*100}%`);
    parts.push(`折現 ${r*100}%`);
    note.textContent = parts.join('　|　');
  }
}

function _syncToValMethod() {
  // 預估 EPS 區 → 逍遙評價法連動
  const q1 = parseNum('estQ1'), q2 = parseNum('estQ2'), q3 = parseNum('estQ3'), q4 = parseNum('estQ4');

function calcValMethod() {
  const el = document.getElementById('vmResultContainer');
  if (!el) return;

  // 讀取參數（優先自訂，fallback 預設）
  const eps   = parseNum('vmEps');
  const div   = parseNum('vmDiv');
  const ltDiv = parseNum('vmLtDiv');
  const yHigh = parseNum('yldHigh') || _yHigh;
  const yMax  = parseNum('yldMax') || _yMax;
  const peHi  = parseNum('peHigh') || _peHi;
  const peLo  = parseNum('peLow') || _peLo;

  // 顯示自動帶入的殖利率
  const vmYH = document.getElementById('vmYldHigh');
  const vmYM = document.getElementById('vmYldMax');
  if (vmYH) vmYH.textContent = yHigh + '%';
  if (vmYM) vmYM.textContent = yMax + '%';

  // 手動修改時即時更新來源註記
  if (_vmManual) {
    const vmNote = document.getElementById('vmSourceNote');
    if (vmNote) {
      const _epsVal = eps != null ? eps.toFixed(2) : '-';
      const _divVal = div != null ? div.toFixed(2) : '-';
      const _ltVal = ltDiv != null ? ltDiv.toFixed(2) : '-';
      vmNote.innerHTML = `EPS：手動設定 = ${_epsVal}<br>股利：手動設定 = ${_divVal}<br>綜合股利：手動設定 = ${_ltVal}<br><span style="color:#94a3b8">與總表評價門檻使用相同的 EPS / 股利來源。手動修改上方欄位後儲存，總表也會同步更新。</span>`;
    }
  }

  let gradeA, gradeA1, gradeA2, gradeAA, lt5, lt6, lt7;

  // 優先使用 DB 預算好的門檻值（與總表同源）
  if (_useDbVal && _dbValThresholds &&
      _dbValThresholds.val_aa != null && _dbValThresholds.val_a != null) {
    gradeA  = _dbValThresholds.val_a;
    gradeA1 = _dbValThresholds.val_a1;
    gradeA2 = _dbValThresholds.val_a2;
    gradeAA = _dbValThresholds.val_aa;
    lt6     = _dbValThresholds.val_lt6;
    // lt5/lt7 DB 沒存，從 ltDiv 推算
    lt5 = ltDiv != null ? ltDiv / 0.05 : null;
    lt7 = ltDiv != null ? ltDiv / 0.07 : null;
  } else {
    // 使用者改參數後的即時預覽（前端計算）
    if (!eps || !div) {
      el.innerHTML = '<div style="color:#94a3b8;font-size:.85rem;padding:8px 0">請先填入所有參數</div>';
      return;
    }

    const peFair  = (peHi + peLo) / 2;
    const peBelow = (peFair + peLo) / 2;

    const yHighR = yHigh / 100;
    const yMaxR  = yMax / 100;

    const ltYldR = _ltYld / 100;
    const ltTerm = (ltDiv != null && ltYldR > 0) ? (ltDiv / ltYldR + div) : null;

    gradeA  = Math.min(eps * peBelow, div / yHighR, ...(ltTerm != null ? [ltTerm] : []));
    gradeA1 = Math.min(eps * peLo,    div / yHighR, ...(ltTerm != null ? [ltTerm] : []));
    gradeA2 = Math.min(eps * peBelow, div / yMaxR,  ...(ltTerm != null ? [ltTerm] : []));
    gradeAA = Math.min(eps * peLo,    div / yMaxR,  ...(ltTerm != null ? [ltTerm] : []));

    lt5 = ltDiv != null ? ltDiv / 0.05 : null;
    lt6 = ltDiv != null && ltYldR > 0 ? ltDiv / ltYldR : null;
    lt7 = ltDiv != null ? ltDiv / 0.07 : null;
  }

  const f = v => v != null && isFinite(v) ? v.toFixed(2) : '-';

  let html = '<table class="val-result-table"><thead><tr>';
  html += '<th>股價</th><th>A級評價</th><th>A1級評價</th><th>A2級評價</th><th>AA級評價</th>';
  html += '<th>長期5%</th><th>長期6%</th><th>長期7%</th>';
  html += '</tr></thead><tbody><tr>';
  html += `<td class="price-cell">${_estPrice ? _estPrice.toFixed(2) : '-'}</td>`;
  html += `<td class="grade-a">${f(gradeA)}</td>`;
  html += `<td class="grade-a">${f(gradeA1)}</td>`;
  html += `<td class="grade-a">${f(gradeA2)}</td>`;
  html += `<td class="grade-aa">${f(gradeAA)}</td>`;
  html += `<td class="grade-long">${f(lt5)}</td>`;
  html += `<td class="grade-long">${f(lt6)}</td>`;
  html += `<td class="grade-long">${f(lt7)}</td>`;
  html += '</tr></tbody></table>';

  el.innerHTML = html;
}

  // 避免重複存
  if (existing.includes(line)) {
    alert('這則已經存過了');
    return;

  const updated = existing ? existing + '\n' + line : line;

  alert('已存入筆記');

    ${tableHtml}`;

  renderIndRows();
}

function renderIndRows() {
  const d = indData;
  let peers = [...d.peers];
  const q = document.getElementById('indSearch')?.value.trim().toLowerCase() || '';
  const mkt = document.getElementById('indMarket')?.value || '';

  if (q) peers = peers.filter(p => p.code.toLowerCase().includes(q) || (p.name||'').toLowerCase().includes(q));
  if (mkt) peers = peers.filter(p => p.market === mkt);

  // 排序
  const sk = indSort.key;
  peers.sort((a, b) => {
    let va = sk === 'name' ? (a.name||'') : (a[sk] ?? null);
    let vb = sk === 'name' ? (b.name||'') : (b[sk] ?? null);
    if (va === null && vb === null) return 0;
    if (va === null) return 1;
    if (vb === null) return -1;
    if (typeof va === 'string') return indSort.asc ? va.localeCompare(vb) : vb.localeCompare(va);
    return indSort.asc ? va - vb : vb - va;
  });

  const body = document.getElementById('indBody');
  if (!body) return;
  let html = '';
  for (const p of peers) {
    const isTarget = p.code === CODE;
    const cls = isTarget ? ' class="row-target"' : '';
    html += `<tr${cls}>`;
    html += `<td><a href="/company.html?code=${p.code}" style="color:#2563eb;text-decoration:none;font-weight:${isTarget?700:500}">${p.code} ${p.name||''}</a></td>`;
    html += `<td>${p.close != null ? p.close.toFixed(1) : '-'}</td>`;
    for (const m of IND_METRICS) {
      const v = p[m.key];
      let cls2 = '';
      if (m.key !== 'pe' && v != null) cls2 = v > 0 ? ' class="v-pos"' : v < 0 ? ' class="v-neg"' : '';
      html += `<td${cls2}>${m.fmt(v)}</td>`;
    }
    html += '</tr>';
  }
  body.innerHTML = html;
}

function sortInd(key) {
  if (indSort.key === key) indSort.asc = !indSort.asc;
  else { indSort.key = key; indSort.asc = key === 'pe'; }
  renderIndRows();
}

function filterIndTable() { renderIndRows(); }

// ── 啟動 ──
if (CODE) {
  const _initTab = new URLSearchParams(location.search).get('tab');
  if (_initTab === 'decision') {
    switchTab('decision');
  } else if (_initTab === 'revenue') {
    switchTab('revenue');
  } else if (_initTab === 'notes') {
    switchTab('notes');
  } else if (_initTab === 'report') {
    switchTab('report');
  } else {
    loadFinancial();
  }
  loadImportantNews();
}
