<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日新聞報告</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Microsoft JhengHei', 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a202c; overscroll-behavior-x: none; }
  header {
    background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
    color: #fff; padding: 16px 28px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 1.3rem; font-weight: 700; }
  header a { color: rgba(255,255,255,.8); text-decoration: none; font-size: .88rem; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px 16px; }
  .section { background: #fff; border-radius: 10px; margin-bottom: 16px; box-shadow: 0 1px 6px rgba(0,0,0,.08); overflow: hidden; }
  .section-header {
    padding: 14px 20px; font-weight: 700; font-size: .95rem;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
  }
  .section-header .arrow { font-size: .7em; color: #94a3b8; transition: transform .2s; }
  .section-header .arrow.collapsed { transform: rotate(-90deg); }
  .section-body { padding: 0 20px 16px; }
  .section-body.collapsed { display: none; }
  .yellow-header { background: #fffbeb; color: #92400e; border-bottom: 2px solid #fcd34d; }
  .gray-header { background: #f8fafc; color: #475569; border-bottom: 2px solid #e2e8f0; }
  .stock-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid #f1f5f9; flex-wrap: wrap;
  }
  .stock-row:last-child { border-bottom: none; }
  .stock-code { font-weight: 700; color: #2563eb; text-decoration: none; min-width: 50px; }
  .stock-code:hover { text-decoration: underline; }
  .stock-name { color: #334155; min-width: 80px; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: .78rem; font-weight: 700; }
  .metric { font-size: .84rem; color: #64748b; }
  .date-label { font-size: .82rem; color: rgba(255,255,255,.7); }

  /* Tabs (same as briefing.html) */
  .val-tabs { display: flex; gap: 0; border-bottom: 2px solid #e2e8f0; flex-wrap: wrap; }
  .val-tab {
    padding: 10px 20px; font-size: .88rem; font-weight: 600; cursor: pointer;
    border: none; background: none; color: #94a3b8; position: relative;
    white-space: nowrap;
  }
  .val-tab:hover { color: #475569; }
  .val-tab.active { color: #2563eb; }
  .val-tab.active::after {
    content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
    height: 2px; background: #2563eb;
  }
  .val-tab .tab-count { font-size: .8em; color: #94a3b8; font-weight: 400; margin-left: 4px; }
  .val-tab.active .tab-count { color: #2563eb; }
  .val-tab .tab-arrow { font-size: .6em; color: #94a3b8; margin-left: 4px; transition: transform .2s; display: inline-block; }
  .val-tab.active .tab-arrow { color: #2563eb; }
  .val-tab.active.collapsed .tab-arrow { transform: rotate(-90deg); }
  .val-tab-panel { display: none; padding: 12px 0 4px; }
  .val-tab-panel.active { display: block; }
  .val-tab-panel.collapsed { display: none; }
</style>
</head>
<body>

<header>
  <div>
    <h1>每日新聞報告</h1>
    <span class="date-label" id="dateLabel"></span>
  </div>
  <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <input type="text" id="newsSearch" placeholder="搜尋股票代碼、名稱或關鍵字..." oninput="filterNews()" style="flex:1;min-width:200px;padding:8px 12px;border:1px solid rgba(255,255,255,.3);border-radius:6px;font-size:.85rem;background:rgba(255,255,255,.15);color:#fff">
    <a href="/">回總表</a>
    <a href="/valuation.html">評價報告</a>
    <a href="/etf_changes.html">ETF專區</a>
    <a href="/health.html">系統監控</a>
  </div>
</header>

<div class="container" id="content">
  <div style="text-align:center;padding:60px;color:#94a3b8">載入中...</div>
</div>

<script>
let _news = [];

async function load() {
  try {
    const [briefRes, newsRes] = await Promise.all([
      fetch('/api/daily-briefing'),
      fetch('/api/news?tier=0&days=5'),
    ]);
    const d = await briefRes.json();
    _news = await newsRes.json();
    if (d.data_date) {
      document.getElementById('dateLabel').textContent = `資料日期：${d.data_date}`;
    }
    render();
  } catch(e) {
    document.getElementById('content').innerHTML =
      '<div style="text-align:center;padding:60px;color:#ef4444">無法載入，請確認系統已啟動</div>';
  }
}

function toggle(header) {
  const body = header.nextElementSibling;
  const arrow = header.querySelector('.arrow');
  body.classList.toggle('collapsed');
  arrow.classList.toggle('collapsed');
}

function switchValTab(tabEl, panelId) {
  const panel = document.getElementById(panelId);
  if (tabEl.classList.contains('active')) {
    tabEl.classList.toggle('collapsed');
    panel.classList.toggle('collapsed');
    return;
  }
  tabEl.parentElement.querySelectorAll('.val-tab').forEach(t => { t.classList.remove('active'); t.classList.remove('collapsed'); });
  tabEl.classList.add('active');
  tabEl.closest('.section-body').querySelectorAll('.val-tab-panel').forEach(p => { p.classList.remove('active'); p.classList.remove('collapsed'); });
  panel.classList.add('active');
}

function render() {
  const el = document.getElementById('content');
  const normal = _news.filter(n => n.tier >= 1 && !n.cooled);
  const filtered = _news.filter(n => n.tier === 0);
  const cooled = _news.filter(n => n.cooled);

  // 按日期分組（tier>=1）
  const groups = {};
  normal.forEach(n => {
    const date = (n.created_at || n.date || '').slice(0, 10);
    if (!groups[date]) groups[date] = [];
    groups[date].push(n);
  });
  const dates = Object.keys(groups).sort((a, b) => b.localeCompare(a));

  // 日期 tabs
  const tabsHtml = dates.map((d, i) => {
    const label = d.slice(5).replace('-', '/');
    const cnt = groups[d].length;
    return `<div class="val-tab ${i===0?'active collapsed':''}" onclick="switchValTab(this,'daily-${d}')">${label}<span class="tab-count">(${cnt})</span><span class="tab-arrow">&#9654;</span></div>`;
  }).join('');

  // 被過濾 tab
  const filteredTabHtml = filtered.length > 0
    ? `<div class="val-tab" onclick="switchValTab(this,'daily-filtered')">被過濾<span class="tab-count">(${filtered.length})</span><span class="tab-arrow">&#9654;</span></div>`
    : '';

  // 日期 panels
  const panelsHtml = dates.map((d, i) => {
    const items = groups[d];
    const tier2 = items.filter(n => n.tier === 2);
    const tier1 = items.filter(n => n.tier === 1);
    let content = '';
    if (tier2.length) {
      const pending = tier2.filter(n => !n.status);
      const done = tier2.filter(n => n.status);
      content += renderSection('重大訊息', 'yellow-header', pending, done, true);
    }
    if (tier1.length) {
      const pending = tier1.filter(n => !n.status);
      const done = tier1.filter(n => n.status);
      content += renderSection('一般訊息', 'gray-header', pending, done, false);
    }
    // 該日冷卻中
    const dayCooled = cooled.filter(n => (n.created_at || n.date || '').slice(0,10) === d);
    if (dayCooled.length) {
      content += `<details style="margin-top:8px"><summary style="cursor:pointer;font-size:.82rem;color:#94a3b8">同公司重複訊息（${dayCooled.length} 則）</summary>
      <div style="margin-top:6px">${dayCooled.map(n => newsRow(n, '#f8fafc', '#94a3b8')).join('')}</div></details>`;
    }
    return `<div id="daily-${d}" class="val-tab-panel ${i===0?'active collapsed':''}">${content || '<div style="color:#94a3b8;padding:16px 0">該日無新聞</div>'}</div>`;
  }).join('');

  // 被過濾 panel
  const filteredPanelHtml = filtered.length > 0
    ? `<div id="daily-filtered" class="val-tab-panel">${renderFilteredContent(filtered)}</div>`
    : '';

  el.innerHTML = `
    <div class="section">
      <div class="section-header" style="background:#eff6ff;color:#1e40af;border-bottom:2px solid #93c5fd" onclick="toggle(this)">
        <span style="flex:1">個股重大訊息 (${normal.length})</span>
        <span class="arrow collapsed">&#9654;</span>
      </div>
      <div class="section-body collapsed" style="padding-top:0">
        <div class="val-tabs">${tabsHtml}${filteredTabHtml}</div>
        ${panelsHtml}
        ${filteredPanelHtml}
      </div>
    </div>

    <div class="section">
      <div class="section-header" style="background:#f8fafc;color:#475569;border-bottom:2px solid #e2e8f0" onclick="toggle(this)">
        <span style="flex:1">每日筆記</span>
        <span class="arrow collapsed">&#9654;</span>
      </div>
      <div class="section-body collapsed">
        <textarea id="dailyNoteText" placeholder="看完新聞，寫下今天的想法..." style="width:100%;min-height:120px;border:1px solid #e2e8f0;border-radius:6px;padding:10px;font-size:.88rem;font-family:inherit;resize:vertical;margin-top:8px"></textarea>
        <div style="display:flex;justify-content:flex-end;margin-top:8px;gap:8px;align-items:center">
          <span id="dailyNoteSaved" style="font-size:.8em;color:#16a34a;display:none">已存檔</span>
          <button onclick="saveDailyNote()" style="padding:6px 20px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:.85em;cursor:pointer">存檔</button>
        </div>
      </div>
    </div>`;

  loadTodayNote();
}

async function loadTodayNote() {
  try {
    const today = new Date().toISOString().slice(0, 10);
    const res = await fetch('/api/daily-notes');
    const notes = await res.json();
    const todayNote = notes.find(n => n.date === today);
    const el = document.getElementById('dailyNoteText');
    if (el && todayNote) el.value = todayNote.content;
  } catch(e) {}
}

async function saveDailyNote() {
  const content = document.getElementById('dailyNoteText').value.trim();
  if (!content) return;
  const today = new Date().toISOString().slice(0, 10);
  try {
    const res = await fetch('/api/daily-notes', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({date: today, content})
    });
    const data = await res.json();
    if (data.status === 'ok') {
      const msg = document.getElementById('dailyNoteSaved');
      msg.style.display = 'inline';
      setTimeout(() => msg.style.display = 'none', 2000);
    }
  } catch(e) {
    alert('存檔失敗: ' + e.message);
  }
}

function renderSection(title, headerClass, pending, done, isTier2) {
  let html = `<div style="margin-bottom:12px">
    <div style="font-weight:700;font-size:.9rem;padding:8px 0;color:${headerClass==='yellow-header'?'#92400e':'#475569'};border-bottom:1px solid #e2e8f0">${title}
      <span style="font-weight:400;font-size:.82rem;margin-left:4px">(未處理 ${pending.length} / 已處理 ${done.length})</span>
    </div>`;

  if (isTier2) {
    html += renderT2Group(pending);
  } else {
    pending.forEach(n => html += renderT1Row(n));
  }

  if (done.length) {
    html += `<details style="margin-top:8px"><summary style="cursor:pointer;font-size:.82rem;color:#94a3b8">已處理（${done.length} 則）</summary>
    <div style="margin-top:4px;opacity:.5">`;
    if (isTier2) {
      html += renderT2Group(done);
    } else {
      done.forEach(n => html += renderT1Row(n, false));
    }
    html += '</div></details>';
  }

  html += '</div>';
  return html;
}

function renderFilteredContent(items) {
  const pending = items.filter(n => !n.status);
  const done = items.filter(n => n.status);
  let html = '';
  if (pending.length) {
    html += `<div style="font-size:.82rem;color:#94a3b8;padding:8px 0;border-bottom:1px solid #e2e8f0">被過濾訊息（覺得重要可按「升級」）</div>`;
    pending.forEach(n => html += renderT0Row(n));
  }
  if (done.length) {
    html += `<details style="margin-top:8px"><summary style="cursor:pointer;font-size:.82rem;color:#94a3b8">已處理（${done.length} 則）</summary>
    <div style="margin-top:6px;opacity:.5">${done.map(n => renderT0Row(n)).join('')}</div></details>`;
  }
  return html || '<div style="color:#94a3b8;padding:16px 0">暫無被過濾訊息</div>';
}

function renderT2Group(items) {
  const alarm = items.filter(n => n.direction === 'alarm');
  const neg = items.filter(n => !['positive','alarm'].includes(n.direction));
  const pos = items.filter(n => n.direction === 'positive');
  let h = '';
  if (alarm.length) {
    h += '<div style="margin:10px 0 6px;font-weight:700;color:#7f1d1d;font-size:.95rem">警鈴</div>';
    alarm.forEach(n => h += newsRow(n, '#fecaca', '#7f1d1d'));
  }
  if (neg.length) {
    h += '<div style="margin:10px 0 6px;font-weight:700;color:#991b1b;font-size:.88rem">負向 / 風險</div>';
    neg.forEach(n => h += newsRow(n, '#fee2e2', '#991b1b'));
  }
  if (pos.length) {
    h += '<div style="margin:10px 0 6px;font-weight:700;color:#059669;font-size:.88rem">正向催化劑</div>';
    pos.forEach(n => h += newsRow(n, '#dcfce7', '#166534'));
  }
  return h;
}

function newsRow(n, bg, color) {
  const linkHtml = n.link ? `<a href="${n.link}" target="_blank" style="font-size:.76rem;color:#2563eb;text-decoration:none;white-space:nowrap">查看</a>` : '';
  const buttons = actionButtons(n);
  return `<div class="stock-row" style="background:${bg};border-radius:6px;padding:8px 12px;margin:4px 0">
    <a class="stock-code" href="/company.html?code=${n.code}" target="_blank">${n.code}</a>
    <span class="stock-name">${n.name}</span>
    <span class="tag" style="background:${color};color:#fff">${n.matched_rule}</span>
    <span class="metric" style="flex:1;font-size:.82rem">${(n.subject||'').replace(/\r?\n/g,' ').substring(0, 80)}</span>
    ${linkHtml}
    ${buttons}
  </div>`;
}

function renderT1Row(n, showButtons) {
  if (typeof showButtons === 'undefined') showButtons = true;
  const lnk = n.link ? `<a href="${n.link}" target="_blank" style="font-size:.74rem;color:#2563eb;text-decoration:none">查看</a>` : '';
  const buttons = showButtons ? actionButtons(n) : statusLabel(n);
  return `<div class="stock-row" style="padding:6px 0">
    <a class="stock-code" href="/company.html?code=${n.code}" target="_blank" style="font-size:.82rem">${n.code}</a>
    <span class="stock-name" style="font-size:.82rem">${n.name}</span>
    <span style="font-size:.78rem;color:#94a3b8">${n.matched_rule}</span>
    <span class="metric" style="flex:1;font-size:.8rem">${(n.subject||'').replace(/\r?\n/g,' ').substring(0, 60)}</span>
    ${lnk}
    ${buttons}
  </div>`;
}

function renderT0Row(n) {
  const isDone = n.status === 'dismissed';
  const buttons = isDone ? statusLabel(n) : `
    <button onclick="upgradeNews(${n.id},this)" style="padding:1px 8px;border:1px solid #f59e0b;border-radius:3px;background:#fffbeb;color:#92400e;cursor:pointer;font-size:.7rem">升級</button>
    <button onclick="markNews(${n.id},'dismissed',this)" style="padding:1px 6px;border:1px solid #e2e8f0;border-radius:3px;background:#fff;color:#cbd5e1;cursor:pointer;font-size:.7rem">略</button>`;
  return `<div class="stock-row" style="padding:5px 0;opacity:.7">
    <a class="stock-code" href="/company.html?code=${n.code}" target="_blank" style="font-size:.8rem">${n.code}</a>
    <span class="stock-name" style="font-size:.8rem">${n.name}</span>
    <span style="font-size:.72rem;color:#cbd5e1;background:#f1f5f9;padding:1px 6px;border-radius:3px">${n.matched_rule}</span>
    <span class="metric" style="flex:1;font-size:.78rem">${(n.subject||'').replace(/\r?\n/g,' ').substring(0, 60)}</span>
    ${buttons}
  </div>`;
}

function actionButtons(n) {
  if (n.status) return statusLabel(n) + ` <button onclick="undoNews(${n.id},this)" style="padding:1px 6px;border:1px solid #e2e8f0;border-radius:3px;background:#fff;color:#94a3b8;cursor:pointer;font-size:.68rem">撤銷</button>`;
  return `<button onclick="markNews(${n.id},'important',this)" style="padding:2px 8px;border:1px solid #059669;border-radius:4px;background:#dcfce7;color:#166534;cursor:pointer;font-size:.72rem">重要</button>
    <button onclick="markNews(${n.id},'dismissed',this)" style="padding:2px 8px;border:1px solid #94a3b8;border-radius:4px;background:#f1f5f9;color:#64748b;cursor:pointer;font-size:.72rem">略過</button>`;
}

function statusLabel(n) {
  if (!n.status) return '';
  const label = n.status === 'important' ? '已標重要' : '已略過';
  const bg = n.status === 'important' ? '#dcfce7' : '#f1f5f9';
  const color = n.status === 'important' ? '#059669' : '#94a3b8';
  return `<span style="font-size:.7rem;color:${color};background:${bg};padding:1px 6px;border-radius:3px">${label}</span>`;
}

async function upgradeNews(id, el) {
  try {
    const resp = await fetch(`/api/news/${id}/upgrade`, {method:'POST'});
    if (!resp.ok) throw new Error(resp.statusText);
    const item = _news.find(n => n.id === id);
    if (item) { item.tier = 1; }
    render();
  } catch(e) { console.error('升級失敗:', e); }
}

async function markNews(id, status, el) {
  try {
    const resp = await fetch(`/api/news/${id}/status`, {method:'POST', headers: {'Content-Type':'application/json'}, body:JSON.stringify({status})});
    if (!resp.ok) throw new Error(resp.statusText);
    const item = _news.find(n => n.id === id);
    if (item) item.status = status;
    render();
  } catch(e) { console.error('標記失敗:', e); }
}

async function undoNews(id, el) {
  try {
    const resp = await fetch(`/api/news/${id}/status`, {method:'POST', headers: {'Content-Type':'application/json'}, body:JSON.stringify({status: null})});
    if (!resp.ok) throw new Error(resp.statusText);
    const item = _news.find(n => n.id === id);
    if (item) item.status = null;
    render();
  } catch(e) { console.error('撤銷失敗:', e); }
}

function filterNews() {
  const q = document.getElementById('newsSearch').value.toLowerCase().trim();
  document.querySelectorAll('.stock-row').forEach(row => {
    if (!q) { row.style.display = ''; return; }
    row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

load();
</script>
</body>
</html>
