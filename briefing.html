<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逍遙日報</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Microsoft JhengHei', 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a202c; }
  header {
    background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
    color: #fff; padding: 16px 28px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: 2px; }
  header .date-label { font-size: .82rem; color: rgba(255,255,255,.7); }
  header a { color: rgba(255,255,255,.8); text-decoration: none; font-size: .88rem; }
  header a:hover { color: #fff; }
  .nav-links { display: flex; gap: 16px; align-items: center; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px 16px; }

  /* Summary cards */
  .summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .summary-card {
    background: #fff; border-radius: 10px; padding: 14px; text-align: center;
    box-shadow: 0 1px 6px rgba(0,0,0,.08);
  }
  .summary-card .label { font-size: .75em; color: #64748b; margin-bottom: 4px; }
  .summary-card .value { font-size: 1.5em; font-weight: 700; color: #1e3a5f; }
  .summary-card .delta { font-size: .75em; margin-top: 2px; }
  .delta-up { color: #dc2626; }
  .delta-down { color: #16a34a; }
  .delta-flat { color: #94a3b8; }

  /* Sections */
  .section { background: #fff; border-radius: 10px; margin-bottom: 16px; box-shadow: 0 1px 6px rgba(0,0,0,.08); overflow: hidden; }
  .section-header {
    padding: 14px 20px; font-weight: 700; font-size: .95rem;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
  }
  .section-header .arrow { font-size: .7em; color: #94a3b8; transition: transform .2s; }
  .section-header .arrow.collapsed { transform: rotate(-90deg); }
  .section-body { padding: 0 20px 16px; }
  .section-body.collapsed { display: none; }

  /* Color variants */
  .header-red { background: #fef2f2; color: #991b1b; border-bottom: 2px solid #fca5a5; }
  .header-blue { background: #eff6ff; color: #1e40af; border-bottom: 2px solid #93c5fd; }
  .header-gray { background: #f8fafc; color: #475569; border-bottom: 2px solid #e2e8f0; }
  .header-yellow { background: #fffbeb; color: #92400e; border-bottom: 2px solid #fcd34d; }
  .header-green { background: #f0fdf4; color: #166534; border-bottom: 2px solid #86efac; }
  .header-purple { background: #faf5ff; color: #6b21a8; border-bottom: 2px solid #d8b4fe; }

  /* Flash items */
  .flash-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid #f1f5f9; cursor: pointer;
  }
  .flash-item:last-child { border-bottom: none; }
  .flash-item:hover { background: #f8fafc; margin: 0 -20px; padding: 10px 20px; }
  .flash-item .stock-info { display: flex; align-items: baseline; gap: 8px; }
  .flash-item .code { font-weight: 700; color: #2563eb; }
  .flash-item .name { color: #334155; font-size: .9em; }
  .flash-item .right-info { text-align: right; font-size: .85em; }
  .flash-item .price { font-weight: 700; color: #1a202c; }
  .flash-item .direction { font-size: .78em; color: #64748b; }

  /* Badges */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: .75rem; font-weight: 700; }
  .badge-aa { background: #fef2f2; color: #dc2626; }
  .badge-a1 { background: #fffbeb; color: #d97706; }
  .badge-a2 { background: #fffbeb; color: #b45309; }
  .badge-a { background: #eff6ff; color: #2563eb; }
  .badge-count { background: #f1f5f9; color: #64748b; font-weight: 400; font-size: .8em; padding: 2px 8px; border-radius: 10px; }

  /* Cheap table */
  .cheap-table { width: 100%; border-collapse: collapse; font-size: .85em; }
  .cheap-table th { text-align: left; color: #64748b; font-weight: 400; font-size: .8em; padding: 6px 8px; border-bottom: 1px solid #e2e8f0; }
  .cheap-table td { padding: 8px; border-bottom: 1px solid #f1f5f9; }
  .cheap-table tr:hover { background: #f8fafc; }
  .cheap-table .code-cell { color: #2563eb; font-weight: 700; cursor: pointer; }
  .cheap-table .code-cell:hover { text-decoration: underline; }
  .cheap-table .num { text-align: right; }
  .cheap-table-wrap { overflow-x: auto; }
  .cheap-table th, .cheap-table td { white-space: nowrap; }
  .group-divider {
    padding: 8px 0; font-weight: 700; font-size: .85em; color: #475569;
    display: flex; justify-content: space-between; border-bottom: 1px solid #e2e8f0;
    cursor: pointer; margin-top: 8px;
  }
  .group-divider:first-child { margin-top: 0; }
  .group-content.collapsed { display: none; }

  /* News */
  .news-item { padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
  .news-item:last-child { border-bottom: none; }
  .news-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .stock-tag { font-size: .75em; background: #eff6ff; padding: 1px 6px; border-radius: 4px; color: #2563eb; font-weight: 600; }
  .time-tag { font-size: .72em; color: #94a3b8; }
  .news-subject { font-size: .88em; color: #334155; line-height: 1.5; }
  .dir-alarm { font-size: .68em; background: #fef2f2; color: #dc2626; padding: 1px 5px; border-radius: 3px; }
  .dir-positive { font-size: .68em; background: #f0fdf4; color: #16a34a; padding: 1px 5px; border-radius: 3px; }
  .news-item.tier2 { border-left: 3px solid #f97316; margin-left: -20px; padding-left: 17px; }

  /* Industry news */
  .ind-news-item { padding: 8px 0; border-bottom: 1px solid #f1f5f9; display: flex; align-items: baseline; gap: 10px; }
  .ind-news-item:last-child { border-bottom: none; }
  .ind-source { font-size: .68em; padding: 2px 6px; border-radius: 3px; white-space: nowrap; flex-shrink: 0; }
  .src-udn { background: #fef3c7; color: #92400e; }
  .src-ct { background: #e0e7ff; color: #3730a3; }
  .ind-title { font-size: .88em; color: #334155; flex: 1; }
  .ind-title a { color: #334155; text-decoration: none; }
  .ind-title a:hover { color: #2563eb; text-decoration: underline; }
  .ind-time { font-size: .7em; color: #94a3b8; white-space: nowrap; flex-shrink: 0; }
  .ind-archive { font-size: .7em; color: #94a3b8; cursor: pointer; white-space: nowrap; flex-shrink: 0; padding: 2px 6px; border: 1px solid #e2e8f0; border-radius: 4px; }
  .ind-archive:hover { color: #2563eb; border-color: #93c5fd; background: #eff6ff; }
  .ind-day-active { background: #2563eb !important; color: #fff !important; border-color: #2563eb !important; }
  .ind-date-header { font-size: .8em; color: #64748b; font-weight: 600; padding: 8px 0 4px; border-bottom: 1px solid #e2e8f0; margin-top: 8px; }
  .ind-date-header:first-child { margin-top: 0; }
  .ind-show-more { text-align: center; padding: 8px; color: #2563eb; font-size: .85em; cursor: pointer; border-top: 1px solid #f1f5f9; }
  .ind-show-more:hover { background: #f8fafc; }
  .ind-archived { font-size: .7em; color: #16a34a; white-space: nowrap; flex-shrink: 0; }
  .matched-tag { font-size: .72em; padding: 1px 6px; border-radius: 4px; font-weight: 600; margin-right: 4px; }
  .matched-tag.in-list { background: #fef2f2; color: #dc2626; }
  .matched-tag.not-in-list { background: #f1f5f9; color: #64748b; }

  /* Archive modal */
  .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,.4); z-index: 999; display:flex; align-items:center; justify-content:center; }
  .modal-box { background: #fff; border-radius: 12px; padding: 24px; width: 360px; max-width: 90vw; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
  .modal-box h3 { font-size: .95em; margin-bottom: 12px; color: #1e3a5f; }
  .modal-box input { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: .9em; margin-bottom: 12px; }
  .modal-box input:focus { outline: none; border-color: #2563eb; }
  .modal-box .btn-row { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-box button { padding: 6px 16px; border-radius: 6px; font-size: .85em; cursor: pointer; border: none; }
  .modal-box .btn-cancel { background: #f1f5f9; color: #64748b; }
  .modal-box .btn-save { background: #2563eb; color: #fff; }
  .modal-box .btn-save:hover { background: #1d4ed8; }
  .modal-box .news-preview { font-size: .82em; color: #64748b; margin-bottom: 12px; padding: 8px; background: #f8fafc; border-radius: 6px; }

  /* ETF */
  .etf-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f1f5f9; font-size: .85em; }
  .etf-item:last-child { border-bottom: none; }
  .etf-add { font-size: .72em; background: #f0fdf4; color: #16a34a; padding: 1px 6px; border-radius: 3px; font-weight: 600; }
  .etf-remove { font-size: .72em; background: #fef2f2; color: #dc2626; padding: 1px 6px; border-radius: 3px; font-weight: 600; }

  /* Notes */
  .notes-textarea {
    width: 100%; min-height: 80px; border: 1px solid #e2e8f0; border-radius: 8px;
    padding: 12px; font-size: .9em; font-family: inherit; resize: vertical;
    color: #1a202c; background: #f8fafc;
  }
  .notes-textarea:focus { outline: none; border-color: #2563eb; background: #fff; }
  .notes-textarea::placeholder { color: #94a3b8; }

  .loading { text-align: center; padding: 60px; color: #94a3b8; }

  @media (max-width: 600px) {
    .summary-row { grid-template-columns: repeat(2, 1fr); }
    header { flex-direction: column; gap: 8px; }
    .nav-links { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>逍遙日報</h1>
    <span class="date-label" id="dataDate"></span>
  </div>
  <div class="nav-links">
    <a href="/">總表</a>
    <a href="/daily.html">新聞詳情</a>
    <a href="/valuation.html">評價報告</a>
  </div>
</header>

<div class="container" id="content">
  <div class="loading">載入資料中...</div>
</div>

<script>
let _qualityOnly = false;
let _qualitySet = new Set();
let _focusTrackSet = new Set();

async function loadData() {
  try {
    const [briefRes, newsRes, indRes, listRes] = await Promise.all([
      fetch('/api/daily-briefing'),
      fetch('/api/news?limit=50'),
      fetch('/api/industry-news?days=7'),
      fetch('/api/user-lists')
    ]);
    const brief = await briefRes.json();
    const newsData = await newsRes.json();
    let indNews = [];
    try { indNews = await indRes.json(); } catch(e) {}
    const lists = await listRes.json();
    _qualitySet = new Set((lists.quality || []).map(r => r.code));
    _focusTrackSet = new Set((lists.track || []).map(r => r.code));
    render(brief, newsData, indNews);
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="loading">載入失敗：${e.message}</div>`;
  }
}

function render(brief, newsArr, indNews) {
  const el = document.getElementById('content');
  document.getElementById('dataDate').textContent = brief.data_date || '';

  const dist = brief.val_dist || {};
  const delta = brief.val_dist_delta || {};
  const summary = brief.summary || {};

  const cheaper = (brief.val_level_changes || []).filter(v => v.direction === 'cheaper');
  const expensive = (brief.val_level_changes || []).filter(v => v.direction === 'expensive');

  const cheapListAll = brief.val_cheap_list || [];
  const cheapList = _qualityOnly ? cheapListAll.filter(s => _qualitySet.has(s.code)) : cheapListAll;
  const cheapGroups = { AA: [], A1: [], A2: [], A: [] };
  cheapList.forEach(s => { if (cheapGroups[s.level]) cheapGroups[s.level].push(s); });

  const news = newsArr.filter(n => n.tier >= 1);
  const etfChanges = (brief.etf_changes || []).slice(0, 15);

  el.innerHTML = `

    ${cheaper.length > 0 ? `
    <div class="section">
      <div class="section-header header-red" onclick="toggle(this)">
        <span>今日變便宜 (${cheaper.length})</span>
        <span class="arrow collapsed">&#9654;</span>
      </div>
      <div class="section-body collapsed">
        ${cheaper.map(v => flashItemHtml(v)).join('')}
      </div>
    </div>` : ''}

    ${expensive.length > 0 ? `
    <div class="section">
      <div class="section-header header-gray" onclick="toggle(this)">
        <span>今日變貴了 (${expensive.length})</span>
        <span class="arrow collapsed">&#9654;</span>
      </div>
      <div class="section-body collapsed">
        ${expensive.map(v => flashItemHtml(v)).join('')}
      </div>
    </div>` : ''}

    <div class="section">
      <div class="section-header header-blue">
        <span onclick="toggle(this.parentElement)" style="flex:1;cursor:pointer">便宜清單 (${cheapList.length})</span>
        <label style="font-size:.8rem;color:#475569;cursor:pointer;margin-right:8px;font-weight:400" onclick="event.stopPropagation()">
          <input type="checkbox" ${_qualityOnly?'checked':''} onchange="_qualityOnly=this.checked;loadData()" style="vertical-align:middle"> 僅體質佳
        </label>
        <span class="arrow collapsed" onclick="toggle(this.parentElement)" style="cursor:pointer">&#9654;</span>
      </div>
      <div class="section-body collapsed">
        <div style="font-size:.78rem;color:#64748b;padding:8px 0 12px;line-height:1.7;border-bottom:1px solid #f1f5f9;margin-bottom:8px">
          <b>EPS 取用順序</b>：使用者預估 > min(綜合EPS, 沈董EPS)｜<b>股利</b>：跟隨EPS來源<br>
          <b>本益比</b> = 股價 / 取用EPS｜<b>殖利率</b> = 取用股利 / 股價 × 100%｜來源標記：<b>預</b>=預估 <b>綜</b>=綜合 <b>沈</b>=沈董
        </div>
        ${['AA','A1','A2','A'].map(lv => cheapGroupHtml(lv, cheapGroups[lv] || [])).join('')}
      </div>
    </div>

    ${renderIndNewsSplit(indNews)}

    <div class="section">
      <div class="section-header header-yellow" onclick="toggle(this)">
        <span>個股重大訊息 (${news.length})</span>
        <span class="arrow collapsed">&#9654;</span>
      </div>
      <div class="section-body collapsed">
        ${news.slice(0, 20).map(n => newsHtml(n)).join('')}
        ${news.length > 20 ? `
          <div id="news-hidden" style="display:none">${news.slice(20).map(n => newsHtml(n)).join('')}</div>
          <div class="ind-show-more" onclick="document.getElementById('news-hidden').style.display='block';this.style.display='none'">
            顯示更多（還有 ${news.length - 20} 則）
          </div>` : ''}
      </div>
    </div>

    ${etfChanges.length > 0 ? `
    <div class="section">
      <div class="section-header header-green" onclick="toggle(this)">
        <span>ETF 異動 (${etfChanges.length})</span>
        <span class="arrow collapsed">&#9654;</span>
      </div>
      <div class="section-body collapsed">
        ${etfChanges.map(e => etfHtml(e)).join('')}
      </div>
    </div>` : ''}

    <div class="section">
      <div class="section-header header-gray" onclick="toggle(this)">
        <span>今日筆記</span>
        <span class="arrow collapsed">&#9654;</span>
      </div>
      <div class="section-body collapsed">
        <textarea class="notes-textarea" id="dailyNoteText" placeholder="看完報告，寫下今天的想法..."></textarea>
        <div style="display:flex;justify-content:flex-end;margin-top:8px;gap:8px;align-items:center">
          <span id="dailyNoteSaved" style="font-size:.8em;color:#16a34a;display:none">已存檔</span>
          <button onclick="saveDailyNote()" style="padding:6px 20px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:.85em;cursor:pointer">存檔</button>
        </div>
      </div>
    </div>
  `;

  // 載入今天已有的筆記
  loadTodayNote();
}

async function loadTodayNote() {
  try {
    const today = new Date().toISOString().slice(0, 10);
    const res = await fetch('/api/daily-notes');
    const notes = await res.json();
    const todayNote = notes.find(n => n.date === today);
    const el = document.getElementById('dailyNoteText');
    if (el && todayNote) el.value = todayNote.content;
  } catch(e) {}
}

async function saveDailyNote() {
  const content = document.getElementById('dailyNoteText').value.trim();
  if (!content) return;
  const today = new Date().toISOString().slice(0, 10);
  try {
    const res = await fetch('/api/daily-notes', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({date: today, content})
    });
    const data = await res.json();
    if (data.status === 'ok') {
      const msg = document.getElementById('dailyNoteSaved');
      msg.style.display = 'inline';
      setTimeout(() => msg.style.display = 'none', 2000);
    }
  } catch(e) {
    alert('存檔失敗: ' + e.message);
  }
}

function summaryCard(label, value, delta) {
  const d = delta || 0;
  const cls = d > 0 ? 'delta-up' : d < 0 ? 'delta-down' : 'delta-flat';
  const sign = d > 0 ? '+' : '';
  return `<div class="summary-card">
    <div class="label">${label}</div>
    <div class="value">${value || 0}</div>
    <div class="delta ${cls}">${d !== 0 ? sign + d : '-'}</div>
  </div>`;
}

function summaryCard2(label, value, color) {
  return `<div class="summary-card">
    <div class="label">${label}</div>
    <div class="value" style="color:${color}">${value || 0}</div>
  </div>`;
}

function flashItemHtml(v) {
  const level = v.to || v.from || '';
  const badgeCls = level === 'AA' ? 'badge-aa' : level === 'A1' ? 'badge-a1' : level === 'A2' ? 'badge-a2' : 'badge-a';
  const dirText = v.direction === 'cheaper' ? `${v.from || '?'} → ${v.to}` : `${v.from} → ${v.to || '脫離'}`;
  return `<div class="flash-item" onclick="window.open('/company.html?code=${v.code}','_blank')">
    <div class="stock-info">
      <span class="code">${v.code}</span>
      <span class="name">${v.name}</span>
      <span class="badge ${badgeCls}">${level}</span>
    </div>
    <div class="right-info">
      <div class="price">$${v.price}</div>
      <div class="direction">${dirText}</div>
    </div>
  </div>`;
}

function _revStr(v) { return v != null ? (v > 0 ? '+' : '') + v.toFixed(1) + '%' : '-'; }
function _revColor(v) { return v != null ? (v > 0 ? '#dc2626' : v < 0 ? '#16a34a' : '#64748b') : '#cbd5e1'; }

function _growthBadge(signal, rev) {
  if (!signal) return '<span style="color:#cbd5e1">-</span>';
  const colors = {green:'#16a34a', yellow:'#d97706', red:'#dc2626'};
  const labels = {green:'成長', yellow:'持平', red:'衰退'};
  const bgs = {green:'#dcfce7', yellow:'#fef3c7', red:'#fee2e2'};
  const tip = rev != null ? `營收動能:${rev>0?'+':''}${rev.toFixed(1)}%` : '';
  return `<span style="font-size:.72rem;padding:1px 6px;border-radius:4px;background:${bgs[signal]};color:${colors[signal]};font-weight:700;cursor:default" title="${tip}">${labels[signal]}</span>`;
}

function _toggleTrack(cb) {
  const code = cb.dataset.code;
  const action = cb.checked ? 'add' : 'remove';
  if (cb.checked) _focusTrackSet.add(code); else _focusTrackSet.delete(code);
  fetch('/api/user-lists/track', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({action, code})
  });
}

function cheapGroupHtml(level, list) {
  if (list.length === 0) return '';
  const badgeCls = level === 'AA' ? 'badge-aa' : level === 'A1' ? 'badge-a1' : level === 'A2' ? 'badge-a2' : 'badge-a';
  const sorted = list.sort((a,b) => (b.discount_pct||0) - (a.discount_pct||0));
  const isOpen = false;
  return `
    <div class="group-divider" onclick="toggleGroup(this)">
      <span><span class="badge ${badgeCls}">${level}</span> 級</span>
      <span class="badge-count">${list.length} 支 <span class="arrow ${isOpen?'':'collapsed'}">&#9654;</span></span>
    </div>
    <div class="group-content ${isOpen?'':'collapsed'}">
      <div class="cheap-table-wrap">
      <table class="cheap-table">
        <tr>
          <th>追蹤</th><th>代碼</th><th>名稱</th>
          <th class="num">檢核</th><th class="num">趨勢</th>
          <th class="num">股價</th>
          <th class="num">月營收</th><th class="num">累計</th><th class="num">3M</th><th class="num">12M</th>
          <th class="num">本益比</th><th class="num">殖利率</th>
          <th class="num">折價%</th>
          <th>新增</th>
        </tr>
        ${sorted.map(c => {
          const isFocused = _focusTrackSet.has(c.code);
          const chkHtml = c.chk_pass != null
            ? `<a href="/company.html?code=${c.code}&tab=decision" target="_blank" style="text-decoration:none;font-size:.75rem;padding:2px 6px;border-radius:4px;background:#f1f5f9;color:#475569">${c.chk_pass}/${c.chk_total||12}</a>`
            : '-';
          const growthHtml = _growthBadge(c.growth_signal, c.growth_rev);
          const _pe = c.val_pe != null ? c.val_pe : c.shen_pe;
          const _yld = c.val_yld != null ? c.val_yld : c.shen_yld;
          const _src = c.val_source || '沈董';
          const srcTag = `<span style="color:#94a3b8;margin-left:3px">${_src[0]}</span>`;
          const peStr = _pe != null ? _pe.toFixed(1) : '-';
          const peColor = _pe != null ? (_pe <= 10 ? '#dc2626' : _pe <= 15 ? '#334155' : '#64748b') : '#cbd5e1';
          const yldStr = _yld != null ? _yld.toFixed(1) + '%' : '-';
          const yldColor = _yld != null ? (_yld >= 6 ? '#dc2626' : _yld >= 4 ? '#334155' : '#64748b') : '#cbd5e1';
          const dp = c.discount_pct;
          const dpColor = dp != null ? (dp > 30 ? '#dc2626' : '#334155') : '#cbd5e1';
          const dpStr = dp != null ? dp.toFixed(1) + '%' : '-';
          const newHtml = c.is_new ? '<span style="color:#dc2626;font-size:.72em;font-weight:700">NEW</span>' : '';
          return `<tr>
            <td style="text-align:center"><input type="checkbox" style="width:15px;height:15px;cursor:pointer;accent-color:#2563eb" data-code="${c.code}" ${isFocused?'checked':''} onchange="_toggleTrack(this)"></td>
            <td class="code-cell" onclick="window.open('/company.html?code=${c.code}','_blank')">${c.code}</td>
            <td>${c.name}</td>
            <td class="num">${chkHtml}</td>
            <td class="num">${growthHtml}</td>
            <td class="num" style="font-weight:600">${c.price != null ? c.price.toFixed(2) : '-'}</td>
            <td class="num" style="color:${_revColor(c.revenue_yoy)}">${_revStr(c.revenue_yoy)}</td>
            <td class="num" style="color:${_revColor(c.revenue_cum_yoy)}">${_revStr(c.revenue_cum_yoy)}</td>
            <td class="num" style="color:${_revColor(c.rev_3m_yoy)}">${_revStr(c.rev_3m_yoy)}</td>
            <td class="num" style="color:${_revColor(c.rev_12m_yoy)}">${_revStr(c.rev_12m_yoy)}</td>
            <td class="num" style="color:${peColor}">${peStr}${srcTag}</td>
            <td class="num" style="color:${yldColor}">${yldStr}</td>
            <td class="num" style="color:${dpColor};font-weight:${dp > 30 ? '700' : '400'}">${dpStr}</td>
            <td>${newHtml}</td>
          </tr>`; }).join('')}
      </table>
      </div>
    </div>`;
}

function indNewsHtml(n) {
  const isUdn = n.source.includes('經濟');
  const srcCls = isUdn ? 'src-udn' : 'src-ct';
  const srcLabel = n.source.includes('產業') ? '產業' : n.source.includes('股市') ? '股市' : '新聞';
  const srcName = isUdn ? '經濟' : '工商';
  let timeStr = '';
  if (n.time) {
    const m = n.time.match(/(\d{2}:\d{2})/);
    if (m) timeStr = m[1];
  }
  const safeTitle = n.title.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');
  const archiveBtn = n.archived_code
    ? `<span class="ind-archived">${n.archived_code}</span>`
    : `<span class="ind-archive" data-id="${n.id}" data-title="${safeTitle}" onclick="showArchiveModal(+this.dataset.id, this.dataset.title)">歸檔</span>`;
  return `<div class="ind-news-item">
    <span class="ind-source ${srcCls}">${srcName} ${srcLabel}</span>
    <span class="ind-title"><a href="${n.link}" target="_blank">${n.title}</a></span>
    ${timeStr ? `<span class="ind-time">${timeStr}</span>` : ''}
    ${archiveBtn}
  </div>`;
}

function newsHtml(n) {
  const cls = n.tier === 2 ? 'news-item tier2' : 'news-item';
  const dirTag = n.direction === 'alarm' ? '<span class="dir-alarm">警示</span>' :
    n.direction === 'positive' ? '<span class="dir-positive">正向</span>' : '';
  const timeStr = n.created_at ? n.created_at.slice(11, 16) : '';
  return `<div class="${cls}">
    <div class="news-meta">
      <span class="stock-tag">${n.code} ${n.name}</span>
      <span class="time-tag">${timeStr}</span>
      ${dirTag}
    </div>
    <div class="news-subject">${n.subject}</div>
  </div>`;
}

function etfHtml(e) {
  const cls = e.action === 'add' ? 'etf-add' : 'etf-remove';
  const label = e.action === 'add' ? '納入' : '剔除';
  return `<div class="etf-item">
    <span class="${cls}">${label}</span>
    <span style="color:#64748b">${e.etf_name}</span>
    <span>${e.stock_code} ${e.stock_name}</span>
    <span style="color:#94a3b8;font-size:.75em;margin-left:auto">${e.change_date}</span>
  </div>`;
}

function toggle(header) {
  const body = header.nextElementSibling;
  const arrow = header.querySelector('.arrow');
  body.classList.toggle('collapsed');
  arrow.classList.toggle('collapsed');
}

function toggleGroup(divider) {
  const content = divider.nextElementSibling;
  const arrow = divider.querySelector('.arrow');
  content.classList.toggle('collapsed');
  arrow.classList.toggle('collapsed');
}

function renderIndNewsByDate(indNews) {
  // 按日期分組
  const groups = {};
  indNews.forEach(n => {
    const d = (n.time || n.created_at || '').slice(0, 10) || '未知';
    if (!groups[d]) groups[d] = [];
    groups[d].push(n);
  });
  const dates = Object.keys(groups).sort().reverse();
  const today = new Date().toISOString().slice(0, 10);

  return dates.map(date => {
    const items = groups[date];
    const dateId = 'ind-' + date.replace(/-/g, '');
    const isToday = date === today;
    return `
      <div class="group-divider" onclick="toggleGroup(this)">
        <span>${date}${isToday ? '（今天）' : ''}</span>
        <span class="badge-count">${items.length} 則 <span class="arrow ${isToday ? '' : 'collapsed'}">&#9654;</span></span>
      </div>
      <div class="group-content ${isToday ? '' : 'collapsed'}">
        ${items.map(n => indNewsHtml(n)).join('')}
      </div>`;
  }).join('');
}

async function refreshIndustryNews(btn) {
  btn.textContent = '更新中...';
  btn.style.pointerEvents = 'none';
  try {
    const res = await fetch('/api/industry-news/refresh', {method:'POST'});
    const data = await res.json();
    btn.textContent = `+${data.inserted || 0} 則`;
    setTimeout(() => loadData(), 800);
  } catch(e) {
    btn.textContent = '失敗';
  }
  setTimeout(() => { btn.textContent = '更新'; btn.style.pointerEvents = ''; }, 2000);
}

function showArchiveModal(newsId, title) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>歸檔到個股筆記</h3>
      <div class="news-preview">${title}</div>
      <input type="text" id="archiveCode" placeholder="輸入股票代碼（如 2330）" autofocus>
      <div class="btn-row">
        <button class="btn-cancel" onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="btn-save" onclick="doArchive(${newsId}, this)">歸檔</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(() => overlay.querySelector('#archiveCode').focus(), 100);
  overlay.querySelector('#archiveCode').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doArchive(newsId, overlay.querySelector('.btn-save'));
  });
}

async function doArchive(newsId, btn) {
  const code = document.getElementById('archiveCode').value.trim();
  if (!code) return;
  btn.textContent = '歸檔中...';
  btn.disabled = true;
  try {
    const res = await fetch(`/api/industry-news/${newsId}/archive`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({code})
    });
    const data = await res.json();
    if (data.status === 'ok') {
      btn.closest('.modal-overlay').remove();
      loadData();  // 重新載入，顯示已歸檔狀態
    } else {
      alert(data.error || '歸檔失敗');
      btn.textContent = '歸檔';
      btn.disabled = false;
    }
  } catch (e) {
    alert('歸檔失敗: ' + e.message);
    btn.textContent = '歸檔';
    btn.disabled = false;
  }
}

loadData();
</script>
