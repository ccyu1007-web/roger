<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日筆記</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Microsoft JhengHei', 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a202c; }
  header {
    background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
    color: #fff; padding: 16px 28px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 1.3rem; font-weight: 700; }
  header a { color: rgba(255,255,255,.8); text-decoration: none; font-size: .88rem; }
  header a:hover { color: #fff; }
  .container { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }

  .note-card {
    background: #fff; border-radius: 10px; margin-bottom: 12px;
    box-shadow: 0 1px 6px rgba(0,0,0,.08); overflow: hidden;
  }
  .note-header {
    padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #f1f5f9;
  }
  .note-date { font-weight: 700; color: #1e3a5f; font-size: .95rem; }
  .note-delete {
    font-size: .82rem; color: #dc2626; cursor: pointer; padding: 4px 10px;
    border: 1px solid #fecaca; border-radius: 6px; background: #fff;
  }
  .note-delete:hover { background: #fef2f2; }
  .note-body {
    padding: 14px 20px; font-size: .9rem; color: #334155;
    white-space: pre-wrap; line-height: 1.7;
  }

  .empty { text-align: center; padding: 60px; color: #94a3b8; font-size: .95rem; }
  .loading { text-align: center; padding: 60px; color: #94a3b8; }
</style>
</head>
<body>

<header>
  <div>
    <h1>每日筆記</h1>
  </div>
  <div style="display:flex;gap:16px;align-items:center">
    <a href="/">回總表</a>
    <a href="/briefing.html">逍遙日報</a>
  </div>
</header>

<div class="container">
  <div class="note-card" style="margin-bottom:20px">
    <div class="note-header">
      <span class="note-date" id="writeDate"></span>
    </div>
    <div style="padding:14px 20px">
      <textarea id="dailyNoteText" placeholder="寫下今天的想法..." style="width:100%;min-height:100px;border:1px solid #e2e8f0;border-radius:6px;padding:10px;font-size:.88rem;font-family:inherit;resize:vertical"></textarea>
      <div style="display:flex;justify-content:flex-end;margin-top:8px;gap:8px;align-items:center">
        <span id="dailyNoteSaved" style="font-size:.8em;color:#16a34a;display:none">已存檔</span>
        <button onclick="saveDailyNote()" style="padding:6px 20px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:.85em;cursor:pointer">存檔</button>
      </div>
    </div>
  </div>
  <div id="content">
    <div class="loading">載入中...</div>
  </div>
</div>

<script>
const _today = new Date().toISOString().slice(0, 10);
document.getElementById('writeDate').textContent = _today;

async function saveDailyNote() {
  const content = document.getElementById('dailyNoteText').value.trim();
  if (!content) return;
  try {
    const res = await fetch('/api/daily-notes', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({date: _today, content})
    });
    const data = await res.json();
    if (data.status === 'ok') {
      const msg = document.getElementById('dailyNoteSaved');
      msg.style.display = 'inline';
      setTimeout(() => msg.style.display = 'none', 2000);
      load();
    }
  } catch(e) {
    alert('存檔失敗: ' + e.message);
  }
}

async function load() {
  try {
    const res = await fetch('/api/daily-notes');
    const notes = await res.json();
    const el = document.getElementById('content');

    // 載入今天的筆記到編輯區
    const todayNote = notes.find(n => n.date === _today);
    const textEl = document.getElementById('dailyNoteText');
    if (textEl && todayNote) textEl.value = todayNote.content;

    if (!notes.length) {
      el.innerHTML = '<div class="empty">尚無筆記</div>';
      return;
    }

    el.innerHTML = notes.map(n => `
      <div class="note-card" id="note-${n.date}">
        <div class="note-header">
          <span class="note-date">${n.date}</span>
          <button class="note-delete" onclick="deleteNote('${n.date}')">刪除</button>
        </div>
        <div class="note-body">${escHtml(n.content)}</div>
      </div>
    `).join('');
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="loading" style="color:#dc2626">載入失敗：${e.message}</div>`;
  }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function deleteNote(date) {
  try {
    const res = await fetch(`/api/daily-notes/${date}`, {method:'DELETE'});
    const data = await res.json();
    if (data.status === 'ok') {
      const el = document.getElementById('note-' + date);
      if (el) el.remove();
      const container = document.getElementById('content');
      if (!container.querySelector('.note-card')) {
        container.innerHTML = '<div class="empty">尚無筆記</div>';
      }
    }
  } catch(e) {
    alert('刪除失敗');
  }
}

load();
</script>
</body>
</html>
