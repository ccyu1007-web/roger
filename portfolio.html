<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>持股專區 — 逍遙投資系統</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Microsoft JhengHei', 'Segoe UI', sans-serif; background: #f8fafc; color: #1a202c; }

  header {
    background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
    color: #fff; padding: 16px 28px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,.25);
  }
  header h1 { font-size: 1.3rem; font-weight: 700; }
  header a { color: rgba(255,255,255,.9); font-size: .82rem; font-weight: 600; text-decoration: none; }
  header a:hover { color: #fff; text-decoration: underline; }

  .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

  /* 密碼畫面 */
  #authScreen {
    display: flex; justify-content: center; align-items: center; min-height: 60vh;
  }
  .auth-box {
    background: #fff; border-radius: 12px; padding: 40px; box-shadow: 0 2px 20px rgba(0,0,0,.1);
    text-align: center; max-width: 360px; width: 100%;
  }
  .auth-box h2 { margin-bottom: 20px; color: #1e3a5f; }
  .auth-box input {
    width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px;
    font-size: 1rem; text-align: center; letter-spacing: 4px; outline: none;
  }
  .auth-box input:focus { border-color: #2563eb; }
  .auth-box button {
    margin-top: 16px; width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: #2563eb; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  .auth-box button:hover { background: #1d4ed8; }
  .auth-error { color: #dc2626; font-size: .85rem; margin-top: 10px; display: none; }

  /* 主畫面 */
  #mainScreen { display: none; }

  /* Tab 列 */
  .tab-bar {
    display: flex; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .tab-btn {
    padding: 8px 20px; border: 2px solid #e2e8f0; border-radius: 8px;
    background: #fff; cursor: pointer; font-size: .9rem; font-weight: 600; color: #64748b;
  }
  .tab-btn.active { border-color: #2563eb; background: #2563eb; color: #fff; }
  .tab-btn:hover:not(.active) { border-color: #94a3b8; }
  .tab-add {
    padding: 8px 16px; border: 2px dashed #cbd5e1; border-radius: 8px;
    background: transparent; cursor: pointer; font-size: .9rem; color: #94a3b8;
  }
  .tab-add:hover { border-color: #2563eb; color: #2563eb; }

  /* 組合卡片 */
  .portfolio-card {
    background: #fff; border-radius: 12px; padding: 24px;
    box-shadow: 0 1px 8px rgba(0,0,0,.06);
  }

  /* 組合資訊列 */
  .portfolio-header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #f1f5f9;
  }
  .ph-item { font-size: .85rem; }
  .ph-label { color: #64748b; }
  .ph-value { font-weight: 700; color: #1e3a5f; }
  .ph-value.positive { color: #dc2626; }
  .ph-value.negative { color: #16a34a; }
  .ph-actions { margin-left: auto; display: flex; gap: 6px; }
  .ph-actions button {
    padding: 4px 12px; border: 1px solid #e2e8f0; border-radius: 6px;
    background: #fff; cursor: pointer; font-size: .78rem; color: #64748b;
  }
  .ph-actions button:hover { background: #f1f5f9; }
  .ph-actions button.danger:hover { background: #fef2f2; color: #dc2626; border-color: #fca5a5; }

  /* 持股表 */
  .holdings-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  .holdings-table th {
    background: #1e3a5f; color: #fff; padding: 8px 12px; text-align: center;
    font-weight: 600; white-space: nowrap;
  }
  .holdings-table td {
    padding: 7px 12px; text-align: center; border-bottom: 1px solid #f1f5f9;
  }
  .holdings-table tbody tr:nth-child(even) td { background: #c7d8f5; }
  .holdings-table tbody tr:hover td { background: #a8c4f0; }
  .holdings-table .code-col { font-weight: 700; color: #1e3a5f; }
  .holdings-table .name-col { text-align: left; }
  .holdings-table .num-col { text-align: right; font-variant-numeric: tabular-nums; }
  .holdings-table input[type="number"] {
    width: 70px; padding: 3px 6px; border: 1px solid #e2e8f0; border-radius: 4px;
    text-align: right; font-size: .85rem;
  }
  .holdings-table input:focus { border-color: #2563eb; outline: none; }
  .del-btn {
    background: none; border: none; color: #cbd5e1; cursor: pointer; font-size: 1rem;
  }
  .del-btn:hover { color: #dc2626; }

  /* 新增持股列 */
  .add-row { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
  .add-row input[type="text"] {
    width: 120px; padding: 6px 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: .85rem;
  }
  .add-row button {
    padding: 6px 16px; border: none; border-radius: 6px;
    background: #2563eb; color: #fff; font-size: .85rem; cursor: pointer;
  }
  .add-row button:hover { background: #1d4ed8; }

  /* 摘要列 */
  .summary-bar {
    display: flex; gap: 24px; margin-top: 16px; padding-top: 16px;
    border-top: 2px solid #f1f5f9; flex-wrap: wrap;
  }
  .summary-item { text-align: center; }
  .summary-label { font-size: .75rem; color: #94a3b8; }
  .summary-value { font-size: 1.1rem; font-weight: 700; color: #1e3a5f; }
  .summary-value.positive { color: #dc2626; }
  .summary-value.negative { color: #16a34a; }

  /* 編輯 modal */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,.4); z-index: 1000; justify-content: center; align-items: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: #fff; border-radius: 12px; padding: 28px; max-width: 420px; width: 90%;
    box-shadow: 0 4px 30px rgba(0,0,0,.15);
    max-height: 90vh; overflow-y: auto;
  }
  .modal-box h3 { margin-bottom: 16px; color: #1e3a5f; }
  .modal-field { margin-bottom: 12px; }
  .modal-field label { display: block; font-size: .82rem; color: #64748b; margin-bottom: 4px; }
  .modal-field input, .modal-field textarea {
    width: 100%; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 6px;
    font-size: .9rem; outline: none;
  }
  .modal-field input:focus, .modal-field textarea:focus { border-color: #2563eb; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal-actions button {
    padding: 8px 20px; border-radius: 6px; font-size: .9rem; cursor: pointer; border: none;
  }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-cancel { background: #f1f5f9; color: #64748b; }
  .btn-cancel:hover { background: #e2e8f0; }

  .fmt-num { font-variant-numeric: tabular-nums; }

  /* 全組合總計 */
  .total-summary-card {
    background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
    color: #fff; border-radius: 12px; padding: 20px 24px; margin-top: 24px;
  }
  .total-summary-card .summary-bar { border-top: 1px solid rgba(255,255,255,.2); }
  .total-summary-card .summary-label { color: rgba(255,255,255,.7); }
  .total-summary-card .summary-value { color: #fff; }
  .total-summary-card .summary-value.positive { color: #fca5a5; }
  .total-summary-card .summary-value.negative { color: #86efac; }
  .total-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }

  /* 類型分組 */
  .type-section { margin-bottom: 32px; }
  .type-subtotal {
    background: #f8fafc; border-radius: 8px; padding: 12px 16px; margin-top: 8px; margin-bottom: 8px;
    padding-left: 16px;
  }
  .subtotal-label { font-size: .85rem; font-weight: 700; color: #475569; }
  .subtotal-table { width: 100%; border-collapse: collapse; font-size: .82rem; margin-top: 10px; }
  .subtotal-table th { background: #e2e8f0; color: #475569; padding: 6px 10px; text-align: center; font-weight: 600; }
  .subtotal-table td { padding: 5px 10px; text-align: right; border-bottom: 1px solid #f1f5f9; }
  .subtotal-table .positive { color: #dc2626; }
  .subtotal-table .negative { color: #16a34a; }
  .subtotal-total-row td { border-top: 2px solid #94a3b8; font-weight: 700; font-size: .88rem; padding-top: 8px; }

  /* Dashboard 總覽卡片 */
  .dashboard { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
  .dash-card {
    border-radius: 10px; padding: 16px 20px; cursor: pointer; transition: box-shadow .15s;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .dash-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.12); }
  .dash-card-title { font-weight: 700; font-size: .95rem; min-width: 100px; }
  .dash-card .dash-item { text-align: center; }
  .dash-card .dash-label { font-size: .7rem; color: rgba(0,0,0,.5); }
  .dash-card .dash-val { font-size: .95rem; font-weight: 700; }
  .dash-card-grand {
    background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%); color: #fff;
  }
  .dash-card-grand .dash-label { color: rgba(255,255,255,.7); }
  .dash-card-grand .dash-val { color: #fff; }
  .dash-card-grand .positive { color: #fca5a5; }
  .dash-card-grand .negative { color: #86efac; }
  .dash-card-type {
    background: #fff; border: 2px solid #e2e8f0;
  }
  .dash-card-type .positive { color: #dc2626; }
  .dash-card-type .negative { color: #16a34a; }
  .dash-card-type .bonus-val { color: #d97706; }
  .dash-arrow { margin-left: auto; font-size: 1.2rem; color: #94a3b8; transition: transform .2s; }
  .dash-arrow.open { transform: rotate(90deg); }
</style>
</head>
<body>
<header>
  <h1>持股專區</h1>
  <div style="display:flex;gap:16px;align-items:center">
    <a href="/">總表</a>
    <a href="/briefing.html">逍遙日報</a>
    <a href="/valuation.html">評價報告</a>
  </div>
</header>

<!-- 密碼畫面 -->
<div id="authScreen">
  <div class="auth-box">
    <h2>持股專區</h2>
    <p style="color:#64748b;margin-bottom:20px;font-size:.9rem">請輸入密碼</p>
    <input type="password" id="pwInput" placeholder="密碼" autocomplete="off">
    <button type="button" id="authBtn">進入</button>
    <div class="auth-error" id="authError">密碼錯誤</div>
  </div>
</div>

<!-- 主畫面 -->
<div id="mainScreen" class="container">
  <div class="tab-bar" id="tabBar"></div>
  <div id="dashboardSection"></div>
  <div id="portfolioContent"></div>
</div>

<!-- 編輯組合 modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <h3 id="modalTitle">編輯組合</h3>
    <div class="modal-field"><label>組合名稱</label><input type="text" id="mName"></div>
    <div class="modal-field">
      <label>類型</label>
      <select id="mType" style="width:100%;padding:8px 12px;border:1px solid #e2e8f0;border-radius:6px;font-size:.9rem">
        <option value="personal">個人/家人</option>
        <option value="venture">創業</option>
        <option value="managed">代操</option>
      </select>
    </div>
    <div class="modal-field"><label>帳戶名稱（逗號分隔）</label><input type="text" id="mAccounts" placeholder="例：永豐,元大"></div>
    <div class="modal-field"><label>分紅條件</label><input type="text" id="mDivCond" placeholder="例：保利2%，超過後70/30分"></div>
    <div class="modal-field"><label>保利利率 (%)</label><input type="number" id="mInterestRate" step="0.1" placeholder="例：2"></div>
    <div class="modal-field"><label>分紅比例</label><input type="number" id="mDivRatio" step="0.01" placeholder="例：0.3"></div>
    <div class="modal-field"><label>投入本金</label><input type="number" id="mCapital" step="1"></div>
    <div class="modal-field"><label>現金餘額</label><input type="number" id="mCash" step="1"></div>
    <div class="modal-field"><label>備註</label><textarea id="mNotes" rows="3" style="width:100%;padding:8px 12px;border:1px solid #e2e8f0;border-radius:6px;font-size:.9rem;resize:vertical" placeholder="帳戶備註..."></textarea></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-primary" onclick="saveModal()">儲存</button>
    </div>
  </div>
</div>

<script>
const API = '';
let TOKEN = sessionStorage.getItem('portfolio_token') || '';
let portfolios = [];
let editingPid = null;

function headers() {
  return { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' };
}

function fmt(n) {
  if (n == null) return '—';
  return Math.round(n).toLocaleString('zh-TW');
}
function fmtPrice(n) {
  if (n == null) return '—';
  return n.toLocaleString('zh-TW', {minimumFractionDigits: 1, maximumFractionDigits: 2});
}
function fmtPct(n) {
  if (n == null) return '—';
  return n.toFixed(2) + '%';
}
function round2(n) { return Math.round(n * 100) / 100; }

// ── 認證 ──
async function doAuth() {
  const pw = document.getElementById('pwInput').value;
  if (!pw) { alert('請輸入密碼'); return; }
  const err = document.getElementById('authError');
  err.style.display = 'none';
  try {
    const r = await fetch(API + '/api/portfolio/auth', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({password: pw})
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.error === 'wrong password' ? '密碼錯誤' : d.error; err.style.display = 'block'; return; }
    TOKEN = d.token;
    sessionStorage.setItem('portfolio_token', TOKEN);
    showMain();
  } catch(e) { err.textContent = '連線失敗：' + e.message; err.style.display = 'block'; }
}

async function checkAuth() {
  if (!TOKEN) return false;
  try {
    const r = await fetch(API + '/api/portfolio/list', { headers: headers() });
    if (r.ok) { portfolios = await r.json(); return true; }
  } catch(e) {}
  return false;
}

async function showMain() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'block';
  await loadData();
}

async function loadData() {
  try {
    const r = await fetch(API + '/api/portfolio/list', { headers: headers() });
    if (!r.ok) { const e = await r.json().catch(()=>({})); alert('載入失敗：' + (e.error||r.status)); return; }
    portfolios = await r.json();
  } catch(e) { return; }
  renderAll();
}

const TYPE_ORDER = ['personal', 'venture', 'managed'];
const TYPE_LABELS = { personal: '個人/家人', venture: '創業', managed: '代操' };
const TYPE_COLORS = { personal: '#2563eb', venture: '#7c3aed', managed: '#059669' };

let openSections = {};

function calcTypeStats(list) {
  let c=0,mv=0,ca=0,v=0,pnl=0,b=0;
  list.forEach(p => { c+=p.invested_capital||0; mv+=p.total_market_value||0; ca+=p.cash_balance||0; v+=p.total_value||0; pnl+=p.pnl||0; b+=p.bonus||0; });
  return { capital:c, mv, cash:ca, value:v, pnl, pnlPct: c>0?(pnl/c*100):0, bonus:b };
}

function toggleSection(type) {
  openSections[type] = !openSections[type];
  renderAll();
}

function renderAll() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = `<button class="tab-add" onclick="createPortfolio()">+ 新增組合</button>`;

  const dash = document.getElementById('dashboardSection');
  const box = document.getElementById('portfolioContent');

  if (portfolios.length === 0) {
    dash.innerHTML = '';
    box.innerHTML = '<div style="text-align:center;padding:60px;color:#94a3b8">尚無投資組合，點擊上方「+ 新增組合」建立</div>';
    return;
  }

  // 按類型分組
  const grouped = {};
  TYPE_ORDER.forEach(t => grouped[t] = []);
  portfolios.forEach(p => {
    const t = p.portfolio_type || 'personal';
    if (!grouped[t]) grouped[t] = [];
    grouped[t].push(p);
  });

  // === Dashboard 總覽 ===
  const grand = calcTypeStats(portfolios);
  const gc = grand.pnl > 0 ? 'positive' : grand.pnl < 0 ? 'negative' : '';
  let dHtml = '<div class="dashboard">';
  dHtml += `<div class="dash-card dash-card-grand">
    <div class="dash-card-title">全組合總計</div>
    <div class="dash-item"><div class="dash-label">投入本金</div><div class="dash-val">${fmt(grand.capital)}</div></div>
    <div class="dash-item"><div class="dash-label">總值</div><div class="dash-val">${fmt(grand.value)}</div></div>
    <div class="dash-item"><div class="dash-label">當年度損益</div><div class="dash-val ${gc}">${fmt(grand.pnl)}</div></div>
    <div class="dash-item"><div class="dash-label">損益率</div><div class="dash-val ${gc}">${fmtPct(grand.pnlPct)}</div></div>
    <div class="dash-item"><div class="dash-label">分紅總計</div><div class="dash-val" style="color:#fbbf24">${fmt(grand.bonus)}</div></div>
  </div>`;
  TYPE_ORDER.forEach(type => {
    const list = grouped[type];
    if (list.length === 0) return;
    const s = calcTypeStats(list);
    const color = TYPE_COLORS[type];
    const pc = s.pnl > 0 ? 'positive' : s.pnl < 0 ? 'negative' : '';
    const showBonus = type === 'managed' || type === 'venture';
    const isOpen = openSections[type];
    dHtml += `<div class="dash-card dash-card-type" style="border-left:4px solid ${color}" onclick="toggleSection('${type}')">
      <div class="dash-card-title" style="color:${color}">${TYPE_LABELS[type]}</div>
      <div class="dash-item"><div class="dash-label">投入本金</div><div class="dash-val">${fmt(s.capital)}</div></div>
      <div class="dash-item"><div class="dash-label">總值</div><div class="dash-val">${fmt(s.value)}</div></div>
      <div class="dash-item"><div class="dash-label">當年度損益</div><div class="dash-val ${pc}">${fmt(s.pnl)}</div></div>
      <div class="dash-item"><div class="dash-label">損益率</div><div class="dash-val ${pc}">${fmtPct(s.pnlPct)}</div></div>
      ${showBonus ? `<div class="dash-item"><div class="dash-label">分紅</div><div class="dash-val bonus-val">${fmt(s.bonus)}</div></div>` : ''}
      <div class="dash-arrow ${isOpen?'open':''}">&#9654;</div>
    </div>`;
  });
  dHtml += '</div>';
  dash.innerHTML = dHtml;

  // === 展開的類型區塊 ===
  let html = '';
  TYPE_ORDER.forEach(type => {
    const list = grouped[type];
    if (list.length === 0 || !openSections[type]) return;
    const color = TYPE_COLORS[type];
    const showBonus = type === 'managed' || type === 'venture';
    html += `<div class="type-section">`;
    html += `<div class="type-header" style="border-left:4px solid ${color}; padding-left:12px; margin-bottom:16px">
      <span style="font-size:1.1rem;font-weight:700;color:${color}">${TYPE_LABELS[type]}</span>
    </div>`;

    list.forEach(p => { html += renderOnePortfolio(p, type); });

    // 類型小計表格
    let sCapital=0, sMV=0, sCash=0, sValue=0, sPnl=0, sBonus=0;
    list.forEach(p => { sCapital+=p.invested_capital||0; sMV+=p.total_market_value||0; sCash+=p.cash_balance||0; sValue+=p.total_value||0; sPnl+=p.pnl||0; sBonus+=p.bonus||0; });
    const sPct = sCapital > 0 ? (sPnl/sCapital*100) : 0;
    const sc = sPnl > 0 ? 'positive' : sPnl < 0 ? 'negative' : '';
    html += `<div class="type-subtotal" style="border-left:4px solid ${color}">
      <span class="subtotal-label">${TYPE_LABELS[type]} 小計</span>
      <table class="subtotal-table"><thead><tr>
        <th>帳戶</th><th>投入本金</th><th>總市值</th><th>現金餘額</th><th>總值</th><th>當年度損益</th><th>損益率</th>`;
    if (showBonus) html += `<th>分紅</th>`;
    html += `</tr></thead><tbody>`;
    list.forEach(p => {
      const pc = p.pnl > 0 ? 'positive' : p.pnl < 0 ? 'negative' : '';
      html += `<tr>
        <td style="font-weight:600">${p.name}</td>
        <td class="num-col">${fmt(p.invested_capital)}</td>
        <td class="num-col">${fmt(p.total_market_value)}</td>
        <td class="num-col">${fmt(p.cash_balance)}</td>
        <td class="num-col">${fmt(p.total_value)}</td>
        <td class="num-col ${pc}">${fmt(p.pnl)}</td>
        <td class="num-col ${pc}">${fmtPct(p.pnl_pct)}</td>`;
      if (showBonus) html += `<td class="num-col" style="color:#d97706">${fmt(p.bonus)}</td>`;
      html += `</tr>`;
    });
    html += `</tbody><tfoot><tr class="subtotal-total-row">
        <td style="font-weight:700">合計</td>
        <td class="num-col">${fmt(sCapital)}</td>
        <td class="num-col">${fmt(sMV)}</td>
        <td class="num-col">${fmt(sCash)}</td>
        <td class="num-col">${fmt(sValue)}</td>
        <td class="num-col ${sc}">${fmt(sPnl)}</td>
        <td class="num-col ${sc}">${fmtPct(sPct)}</td>`;
    if (showBonus) html += `<td class="num-col" style="color:#d97706;font-weight:700">${fmt(sBonus)}</td>`;
    html += `</tr></tfoot></table>
    </div>`;
    html += `</div>`;
  });
  box.innerHTML = html;
}

function renderOnePortfolio(p, type) {
  const pnlClass = p.pnl > 0 ? 'positive' : p.pnl < 0 ? 'negative' : '';
  const showBonus = type === 'managed' || type === 'venture';

  let html = `<div class="portfolio-card" style="margin-bottom:16px">`;
  html += `<div class="portfolio-header">`;
  html += `<div class="ph-item"><span class="ph-label">組合：</span><span class="ph-value">${p.name}</span></div>`;
  if (p.dividend_condition) html += `<div class="ph-item"><span class="ph-label">分紅條件：</span><span class="ph-value">${p.dividend_condition}</span></div>`;
  if (p.dividend_ratio) html += `<div class="ph-item"><span class="ph-label">比例：</span><span class="ph-value">${p.dividend_ratio}</span></div>`;
  html += `<div class="ph-item"><span class="ph-label">投入本金：</span><span class="ph-value">${fmt(p.invested_capital)}</span></div>`;
  html += `<div class="ph-actions">`;
  html += `<button onclick="editPortfolio(${p.id})">編輯</button>`;
  html += `<button class="danger" onclick="deletePortfolio(${p.id})">刪除</button>`;
  html += `</div></div>`;

  const accts = p.accounts || [];
  const hasAccts = accts.length > 0;
  html += `<table class="holdings-table"><thead><tr>
    <th>股票代碼</th><th>股票名稱</th><th>股價</th><th>張數</th>
    <th>市值</th><th>持股比重</th>`;
  if (hasAccts) accts.forEach(a => { html += `<th style="background:#475569">${a}</th>`; });
  html += `<th></th></tr></thead><tbody>`;
  p.holdings.forEach(h => {
    html += `<tr>
      <td class="code-col">${h.code}</td>
      <td class="name-col">${h.name}</td>
      <td class="num-col">${fmtPrice(h.price)}</td>`;
    if (hasAccts) {
      html += `<td class="num-col fmt-num">${h.lots}</td>`;
    } else {
      html += `<td><input type="number" value="${h.lots}" min="0" step="0.1"
           onchange="updateLots(${p.id},'${h.code}','',this.value)"></td>`;
    }
    html += `<td class="num-col fmt-num">${fmt(h.market_value)}</td>
      <td class="num-col">${fmtPct(h.weight)}</td>`;
    if (hasAccts) {
      accts.forEach(a => {
        const val = (h.accounts && h.accounts[a]) || 0;
        html += `<td><input type="number" value="${val}" min="0" step="0.1" style="width:60px"
             onchange="updateLots(${p.id},'${h.code}','${a.replace(/'/g,"\\'")}',this.value)"></td>`;
      });
    }
    html += `<td><button class="del-btn" onclick="deleteHolding(${p.id},'${h.code}')" title="刪除">&#x2715;</button></td>
    </tr>`;
  });
  // 現金列
  const cashAmt = p.cash_balance || 0;
  const cashWeight = p.invested_capital > 0 ? round2(cashAmt / p.invested_capital * 100) : 0;
  const colSpan = hasAccts ? accts.length + 1 : 1;
  html += `<tr style="background:#f8fafc;color:#64748b;font-style:italic">
    <td></td><td>現金</td><td></td><td></td>
    <td class="num-col fmt-num">${fmt(cashAmt)}</td>
    <td class="num-col">${fmtPct(cashWeight)}</td>`;
  if (hasAccts) accts.forEach(() => { html += `<td></td>`; });
  html += `<td></td></tr>`;
  // 總計列
  const totalAmt = p.total_market_value + cashAmt;
  const totalWeight = p.invested_capital > 0 ? round2(totalAmt / p.invested_capital * 100) : 0;
  html += `<tr style="font-weight:700;border-top:2px solid #334155;background:#f1f5f9">
    <td></td><td>總計</td><td></td><td></td>
    <td class="num-col fmt-num">${fmt(totalAmt)}</td>
    <td class="num-col">${fmtPct(totalWeight)}</td>`;
  if (hasAccts) accts.forEach(() => { html += `<td></td>`; });
  html += `<td></td></tr>`;
  html += `</tbody></table>`;

  html += `<div class="add-row">
    <input type="text" id="addCode_${p.id}" placeholder="股票代碼">
    <button onclick="addHolding(${p.id})">新增持股</button>
  </div>`;

  html += `<div class="summary-bar">
    <div class="summary-item"><div class="summary-label">投入本金</div><div class="summary-value">${fmt(p.invested_capital)}</div></div>
    <div class="summary-item"><div class="summary-label">總市值</div><div class="summary-value">${fmt(p.total_market_value)}</div></div>
    <div class="summary-item"><div class="summary-label">現金餘額</div><div class="summary-value">${fmt(p.cash_balance)}</div></div>
    <div class="summary-item"><div class="summary-label">總值</div><div class="summary-value">${fmt(p.total_value)}</div></div>
    <div class="summary-item"><div class="summary-label">當年度損益</div><div class="summary-value ${pnlClass}">${fmt(p.pnl)}</div></div>
    <div class="summary-item"><div class="summary-label">損益率</div><div class="summary-value ${pnlClass}">${fmtPct(p.pnl_pct)}</div></div>
    ${showBonus ? `<div class="summary-item"><div class="summary-label">分紅</div><div class="summary-value" style="color:#d97706">${fmt(p.bonus)}</div></div>` : ''}
  </div>`;
  if (p.notes) html += `<div style="padding:8px 16px;color:#64748b;font-size:.85rem"><span style="font-weight:600">備註：</span>${p.notes}</div>`;

  html += `</div>`;
  return html;
}

// ── CRUD ──
async function createPortfolio() {
  // 用 modal 建立
  editingPid = 'new';
  document.getElementById('modalTitle').textContent = '新增組合';
  document.getElementById('mName').value = '';
  document.getElementById('mType').value = 'personal';
  document.getElementById('mAccounts').value = '';
  document.getElementById('mDivCond').value = '';
  document.getElementById('mInterestRate').value = '';
  document.getElementById('mDivRatio').value = '';
  document.getElementById('mCapital').value = 0;
  document.getElementById('mCash').value = 0;
  document.getElementById('editModal').classList.add('show');
}

function editPortfolio(pid) {
  const p = portfolios.find(x => x.id === pid);
  if (!p) return;
  editingPid = pid;
  document.getElementById('modalTitle').textContent = '編輯組合 — ' + p.name;
  document.getElementById('mName').value = p.name;
  document.getElementById('mType').value = p.portfolio_type || 'personal';
  document.getElementById('mAccounts').value = (p.accounts || []).join(',');
  document.getElementById('mDivCond').value = p.dividend_condition || '';
  document.getElementById('mInterestRate').value = p.interest_rate || '';
  document.getElementById('mDivRatio').value = p.dividend_ratio || '';
  document.getElementById('mCapital').value = p.invested_capital || 0;
  document.getElementById('mCash').value = p.cash_balance || 0;
  document.getElementById('mNotes').value = p.notes || '';
  document.getElementById('editModal').classList.add('show');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('show');
  editingPid = null;
}

async function saveModal() {
  if (!editingPid) return;
  const data = {
    name: document.getElementById('mName').value,
    portfolio_type: document.getElementById('mType').value,
    accounts: document.getElementById('mAccounts').value.split(',').map(s=>s.trim()).filter(Boolean),
    dividend_condition: document.getElementById('mDivCond').value,
    interest_rate: parseFloat(document.getElementById('mInterestRate').value) || 0,
    dividend_ratio: parseFloat(document.getElementById('mDivRatio').value) || 0,
    invested_capital: parseFloat(document.getElementById('mCapital').value) || 0,
    cash_balance: parseFloat(document.getElementById('mCash').value) || 0,
    notes: document.getElementById('mNotes').value,
  };
  let r;
  if (editingPid === 'new') {
    r = await fetch(API + '/api/portfolio/create', {
      method: 'POST', headers: headers(),
      body: JSON.stringify(data)
    });
  } else {
    r = await fetch(API + `/api/portfolio/${editingPid}`, {
      method: 'PUT', headers: headers(),
      body: JSON.stringify(data)
    });
  }
  if (!r.ok) { const e = await r.json().catch(()=>({})); alert('儲存失敗：' + (e.error||r.status)); return; }
  closeModal();
  await loadData();
}

async function deletePortfolio(pid) {
  const p = portfolios.find(x => x.id === pid);
  if (!confirm(`確定刪除「${p.name}」？所有持股資料都會一併刪除。`)) return;
  await fetch(API + `/api/portfolio/${pid}`, { method: 'DELETE', headers: headers() });
  activeTab = 0;
  await loadData();
}

async function addHolding(pid) {
  const codeInput = document.getElementById('addCode_' + pid);
  const code = codeInput.value.trim();
  if (!code) return;
  const p = portfolios.find(x => x.id === pid);
  const accts = (p && p.accounts && p.accounts.length) ? p.accounts : [''];
  // 用 Promise.all 一次建完
  await Promise.all(accts.map(a =>
    fetch(API + `/api/portfolio/${pid}/holdings`, {
      method: 'POST', headers: headers(),
      body: JSON.stringify({code, account: a, lots: 0})
    })
  ));
  codeInput.value = '';
  await loadData();
}

async function updateLots(pid, code, account, val) {
  const lots = parseFloat(val) || 0;
  await fetch(API + `/api/portfolio/${pid}/holdings/${code}`, {
    method: 'PUT', headers: headers(),
    body: JSON.stringify({lots, account})
  });
  await loadData();
}

async function deleteHolding(pid, code) {
  // 刪除該股票所有帳戶的記錄（包含 account=""）
  const p = portfolios.find(x => x.id === pid);
  const allAccts = [''];
  if (p && p.accounts) p.accounts.forEach(a => allAccts.push(a));
  await Promise.all(allAccts.map(a =>
    fetch(API + `/api/portfolio/${pid}/holdings/${code}?account=${encodeURIComponent(a)}`, {
      method: 'DELETE', headers: headers()
    })
  ));
  await loadData();
}

// ── 初始化 ──
// 用 document 層級 capture 確保不被擴充功能攔截
document.addEventListener('click', function(e) {
  if (e.target && (e.target.id === 'authBtn' || e.target.closest('#authBtn'))) {
    doAuth();
  }
}, true);
document.getElementById('pwInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doAuth();
});

(async () => {
  if (await checkAuth()) { showMain(); }
})();
</script>
