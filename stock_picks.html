<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選股推薦</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Microsoft JhengHei', 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a202c; }
  header {
    background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
    color: #fff; padding: 16px 28px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 1.3rem; font-weight: 700; }
  header a { color: rgba(255,255,255,.8); text-decoration: none; font-size: .88rem; }
  header a:hover { color: #fff; }
  .container { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
  .date-label { font-size: .82rem; color: rgba(255,255,255,.7); }

  .toolbar {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;
    background: #fff; border-radius: 10px; padding: 12px 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  /* Tab 按鈕 */
  .tab-btn {
    padding: 10px 22px; font-size: .92rem; font-weight: 700; cursor: pointer;
    border: 2px solid #e2e8f0; background: #fff; color: #64748b; transition: all .15s;
  }
  .tab-btn:first-child { border-radius: 8px 0 0 8px; }
  .tab-btn:last-child  { border-radius: 0 8px 8px 0; }
  .tab-btn:not(:first-child) { border-left-width: 1px; }
  .tab-btn.active { background: #1e3a5f; color: #fff; border-color: #1e3a5f; }
  .tab-cnt {
    display: inline-block; font-size: .72rem; font-weight: 700;
    padding: 1px 7px; border-radius: 10px; margin-left: 5px;
  }
  .tab-btn.active .tab-cnt { background: rgba(255,255,255,.25); color: #fff; }
  .tab-btn:not(.active) .tab-cnt { background: #e2e8f0; color: #475569; }

  .toolbar-btn {
    padding: 6px 16px; border: 1px solid #e2e8f0; border-radius: 6px;
    background: #fff; cursor: pointer; font-size: .82rem; color: #475569; font-weight: 600;
  }
  .toolbar-btn:hover { background: #f8fafc; }
  .toolbar-btn.primary { border-color: #2563eb; color: #2563eb; }
  .toolbar-btn.primary:hover { background: #eff6ff; }
  .toolbar-info { font-size: .8rem; color: #94a3b8; margin-left: auto; }

  .report-wrap {
    background: #fff; border-radius: 10px; padding: 24px 28px;
    box-shadow: 0 1px 6px rgba(0,0,0,.08); min-height: 300px;
  }
  .report-wrap h1,.report-wrap h2,.report-wrap h3 { margin: 16px 0 8px; color: #1e3a5f; }
  .report-wrap h1 { font-size: 1.15rem; }
  .report-wrap h2 { font-size: 1.05rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; }
  .report-wrap h3 { font-size: .95rem; }
  .report-wrap table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: .84rem; }
  .report-wrap th,.report-wrap td { border: 1px solid #d1d5db; padding: 6px 10px; text-align: left; }
  .report-wrap th { background: #f1f5f9; font-weight: 600; color: #334155; }
  .report-wrap tbody tr:nth-child(even) { background: #f8fafc; }
  .report-wrap ul,.report-wrap ol { padding-left: 20px; margin: 6px 0; }
  .report-wrap p { margin: 6px 0; line-height: 1.8; }
  .report-wrap strong { color: #1e3a5f; }
  .report-wrap blockquote { border-left: 3px solid #059669; padding-left: 12px; color: #64748b; margin: 8px 0; }
  .report-wrap code { background: #f1f5f9; padding: 1px 5px; border-radius: 3px; font-size: .82rem; }
  .report-wrap a { color: #2563eb; text-decoration: none; }
  .report-wrap hr { border: none; border-top: 1px solid #e2e8f0; margin: 16px 0; }

  .empty { text-align: center; padding: 60px; color: #94a3b8; font-size: .92rem; line-height: 2; }

  /* 說明區 */
  .desc-section {
    background: #fff; border-radius: 10px; padding: 16px 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-top: 20px;
    font-size: .82rem; color: #475569; line-height: 1.8;
  }

  @media print {
    body { background: #fff; }
    header { background: #1e3a5f !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .toolbar { display: none; }
    .desc-section { display: none; }
    .container { max-width: 100%; padding: 0; }
    .report-wrap { box-shadow: none; padding: 12px 0; }
    .report-wrap th { background: #f1f5f9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .report-wrap tbody tr:nth-child(even) { background: #f8fafc !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>選股推薦</h1>
    <span class="date-label" id="dateLabel"></span>
  </div>
  <div style="display:flex;gap:16px;align-items:center">
    <a href="/">回總表</a>
    <a href="/briefing.html">逍遙日報</a>
    <a href="/valuation.html">每日價值評估</a>
  </div>
</header>

<div class="container">

  <!-- Tab + 體質佳 + 按鈕 -->
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap">
    <div style="display:flex;gap:0">
      <button class="tab-btn active" onclick="switchTab('selected',this)">精選<span class="tab-cnt" id="cnt_selected">0</span></button>
      <button class="tab-btn" onclick="switchTab('value',this)">價值型<span class="tab-cnt" id="cnt_value">0</span></button>
      <button class="tab-btn" onclick="switchTab('momentum',this)">動能型<span class="tab-cnt" id="cnt_momentum">0</span></button>
      <button class="tab-btn" onclick="switchTab('neffonly',this)">僅Neff ≥ 1.0<span class="tab-cnt" id="cnt_neffonly">0</span></button>
    </div>
    <label style="font-size:.85rem;color:#475569;cursor:pointer">
      <input type="checkbox" id="qualityOnly" onchange="_qualityOnly=this.checked;updateCounts();loadReport()" style="accent-color:#2563eb;width:16px;height:16px;vertical-align:middle">
      僅體質佳
    </label>
    <button class="toolbar-btn primary" onclick="copyPrompt()">複製分析指令</button>
    <button class="toolbar-btn" onclick="window.print()">匯出PDF</button>
    <span class="toolbar-info" id="toolbarInfo"></span>
  </div>

  <div class="report-wrap" id="reportArea">
    <div class="empty">載入中...</div>
  </div>

  <div class="desc-section">
    <b style="color:#1e3a5f">選股推薦使用方式</b><br>
    1. 按「複製分析指令」→ 貼給 Claude → Claude 讀取量化數據+質性研究筆記 → 產出深度分析報告<br>
    2. 報告自動存入系統，刷新此頁即可看到最新報告<br>
    3. 有質性研究的股票：量化+質化綜合判斷 → 重倉/小買/觀望<br>
    4. 無質性研究的股票：純量化分析 + 標註「待質性研究」<br>
    5. 質性研究更新後，重新複製指令跑一次即可更新報告<br>
    <br>
    <span style="color:#94a3b8">報告來源：每日價值評估精選/價值型/動能型 → AI 深度分析 → 重倉/小買/觀望分類</span>
  </div>

</div>

<script>
let _currentTab = 'selected';
let _qualityOnly = false;
let _stocks = [];
let _qualitySet = new Set();

async function load() {
  // 1. 載入當前 Tab 的報告
  await loadReport();

  // 2. 載入股票數據（供 Tab 計數和 prompt 用）
  try {
    const [stocksRes, listRes] = await Promise.all([fetch('/api/stocks'), fetch('/api/user-lists')]);
    const stocksJson = await stocksRes.json();
    _stocks = stocksJson.data || [];
    const lists = await listRes.json();
    _qualitySet = new Set((lists.quality || []).map(r => r.code));
    updateCounts();
  } catch(e) {
    console.error('股票數據載入失敗:', e);
  }
}

function _isNeffPass(s) {
  const gi = s._gi || {};
  return gi.neff_d != null && gi.neff_d >= 1 && !gi.neff_gray;
}
function _isHighQuality(s) {
  return (s._chk_profit || 0) >= 5 && (s._chk_safety || 0) >= 7;
}
function _isPositiveMomentum(s) {
  const gi = s._gi || {};
  const cum = s.revenue_cum_yoy, m3 = gi.rev_3m_yoy, m12 = gi.rev_12m_yoy;
  return cum != null && cum >= 0 && m3 != null && m3 >= 0 && m12 != null && m12 >= 0;
}

function _getTabPool() {
  let pool = _stocks.filter(s => _isNeffPass(s));
  if (_qualityOnly) pool = pool.filter(s => _qualitySet.has(s.code));
  if (_currentTab === 'selected')  return pool.filter(s => _isHighQuality(s) && _isPositiveMomentum(s));
  if (_currentTab === 'value')     return pool.filter(s => _isHighQuality(s) && !_isPositiveMomentum(s));
  if (_currentTab === 'momentum')  return pool.filter(s => !_isHighQuality(s) && _isPositiveMomentum(s));
  if (_currentTab === 'neffonly')  return pool.filter(s => !_isHighQuality(s) && !_isPositiveMomentum(s));
  return pool;
}

function updateCounts() {
  let pool = _stocks.filter(s => _isNeffPass(s));
  if (_qualityOnly) pool = pool.filter(s => _qualitySet.has(s.code));
  const set = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };
  set('cnt_selected', pool.filter(s => _isHighQuality(s) && _isPositiveMomentum(s)).length);
  set('cnt_value',    pool.filter(s => _isHighQuality(s) && !_isPositiveMomentum(s)).length);
  set('cnt_momentum', pool.filter(s => !_isHighQuality(s) && _isPositiveMomentum(s)).length);
  set('cnt_neffonly', pool.filter(s => !_isHighQuality(s) && !_isPositiveMomentum(s)).length);
}

function switchTab(tab, btn) {
  _currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadReport();
}

function _reportKey() {
  return _currentTab + (_qualityOnly ? '_quality' : '');
}

async function loadReport() {
  const area = document.getElementById('reportArea');
  area.innerHTML = '<div class="empty">載入中...</div>';
  const key = _reportKey();
  try {
    const res = await fetch(`/api/stock-picks/${key}`);
    const data = await res.json();
    if (data.content && data.content.trim()) {
      area.innerHTML = marked.parse(data.content);
      if (data.updated_at) {
        document.getElementById('dateLabel').textContent = `報告日期：${data.updated_at.slice(0,10)}`;
        document.getElementById('toolbarInfo').textContent = `最後更新：${data.updated_at}`;
      }
    } else {
      const tabLabel = {selected:'精選',value:'價值型',momentum:'動能型',neffonly:'僅Neff≥1.0'}[_currentTab];
      const ql = _qualityOnly ? '（僅體質佳）' : '';
      area.innerHTML = `<div class="empty">
        「${tabLabel}${ql}」尚未產出報告。<br><br>
        按「複製分析指令」→ 貼給 Claude → 一次產出所有群組報告。
      </div>`;
      document.getElementById('toolbarInfo').textContent = '';
    }
  } catch(e) {
    area.innerHTML = `<div class="empty" style="color:#ef4444">載入失敗：${e.message}</div>`;
  }
}

function copyPrompt() {
  const today = new Date().toISOString().slice(0,10);
  const tabs = ['selected','value','momentum','neffonly'];
  const tabLabels = {selected:'精選',value:'價值型',momentum:'動能型',neffonly:'僅Neff≥1.0'};

  // 組裝所有群組的股票清單
  const allNeff = _stocks.filter(s => _isNeffPass(s));
  const qualStocks = allNeff.filter(s => _qualitySet.has(s.code));

  const _fmt = s => {
    const gi = s._gi || {};
    const n = s._notes || {};
    return `${s.code} ${s.name} | Neff=${gi.neff_d?.toFixed(2)||'—'} | PE=${gi.pe?.toFixed(1)||'—'}(${gi.pe_src||''}) | 殖利率=${gi.yield?.toFixed(1)||'—'}%(${gi.yld_src||''}) | CAGR=${gi.neff_c?.toFixed(1)||'—'}% | 等級=${s.est_grade||s.shen_grade||''} | A:${s._chk_profit||0}/7 B:${s._chk_safety||0}/10 | 累積=${s.revenue_cum_yoy?.toFixed(1)||'—'}% 3M=${gi.rev_3m_yoy?.toFixed(1)||'—'}% 12M=${gi.rev_12m_yoy?.toFixed(1)||'—'}% | 質性=${n.moat_strength?'有':'無'}`;
  };

  const _filter = (pool, tab) => {
    if (tab === 'selected')  return pool.filter(s => _isHighQuality(s) && _isPositiveMomentum(s));
    if (tab === 'value')     return pool.filter(s => _isHighQuality(s) && !_isPositiveMomentum(s));
    if (tab === 'momentum')  return pool.filter(s => !_isHighQuality(s) && _isPositiveMomentum(s));
    return pool.filter(s => !_isHighQuality(s) && !_isPositiveMomentum(s));
  };

  let groupSections = '';
  tabs.forEach(tab => {
    const label = tabLabels[tab];
    const stocks = _filter(allNeff, tab);
    const qStocks = _filter(qualStocks, tab);
    stocks.sort((a,b) => ((b._gi||{}).neff_d||0) - ((a._gi||{}).neff_d||0));
    qStocks.sort((a,b) => ((b._gi||{}).neff_d||0) - ((a._gi||{}).neff_d||0));

    groupSections += `\n【${label}（${stocks.length}支）】key=${tab}\n`;
    stocks.forEach(s => { groupSections += `- ${_fmt(s)}\n`; });

    groupSections += `\n【${label}+體質佳（${qStocks.length}支）】key=${tab}_quality\n`;
    qStocks.forEach(s => { groupSections += `- ${_fmt(s)}\n`; });
  });

  const prompt = `請根據逍遙投資系統的每日價值評估，一次產出 8 份選股推薦報告（4 群組 × 有無體質佳）。

報告日期：${today}

【所有群組股票清單】
${groupSections}
【步驟一：逐支讀取質性研究筆記】
對所有出現的股票（去重），讀取質性研究筆記：
curl -s "https://tock-system.onrender.com/api/user-notes/{code}"

有筆記的 → 讀取完整內容，整合量化+質化分析
無筆記的 → 純量化分析 + 標註「待質性研究」

【步驟二：深度分析與分類】
對每支股票分析一次（結果共用於該股出現的所有群組），分類為重倉/小買/觀望/待質性研究。

重倉：質性研究<3月 + 護城河≥中 + 信心≥中 + 無風險 + 無逆風
小買：質性部分達標 或 無質性但量化很強
觀望：有風險或重大疑慮
待質性研究：無質性筆記 → 純量化初步判斷

每支 2~3 句具體理由（帶數字）。

【步驟三：產出 8 份報告】
每份報告格式：
## 選股推薦報告 — {群組名稱}
**報告日期**：${today}
### 重倉推薦（X支）
### 小買推薦（X支）
### 觀望（X支）
### 待質性研究（X支）

【步驟四：寫入 Render（8 次 POST）】
每份報告用對應的 key 寫入：
python3 << 'PYEOF'
import json, urllib.request

reports = {
    "selected": """...""",
    "selected_quality": """...""",
    "value": """...""",
    "value_quality": """...""",
    "momentum": """...""",
    "momentum_quality": """...""",
    "neffonly": """...""",
    "neffonly_quality": """...""",
}

for key, content in reports.items():
    data = json.dumps({"content": content}).encode("utf-8")
    req = urllib.request.Request(
        f"https://tock-system.onrender.com/api/stock-picks/{key}",
        data=data, headers={"Content-Type": "application/json"}, method="POST")
    resp = urllib.request.urlopen(req, timeout=30).read().decode()
    print(f"{key}: {resp}")
PYEOF`;

  navigator.clipboard.writeText(prompt).then(() => {
    alert(`8 份選股推薦分析指令已複製到剪貼簿（共 ${allNeff.length} 支）`);
  });
}

load();
</script>
</body>
</html>
