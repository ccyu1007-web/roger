<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選股推薦</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Microsoft JhengHei', 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a202c; }
  header {
    background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
    color: #fff; padding: 16px 28px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 1.3rem; font-weight: 700; }
  header a { color: rgba(255,255,255,.8); text-decoration: none; font-size: .88rem; }
  header a:hover { color: #fff; }
  .container { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }

  .notes-wrap { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
  .notes-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .notes-title { font-size: 1rem; font-weight: 700; color: #1e3a5f; }
  .notes-mode-btn {
    padding: 3px 12px; border: 1px solid #e2e8f0; border-radius: 5px;
    background: #fff; cursor: pointer; font-size: .78rem; color: #64748b; font-weight: 600;
  }
  .notes-mode-btn.active { background: #059669; color: #fff; border-color: #059669; }

  .notes-preview {
    min-height: 200px; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px;
    font-size: .85rem; line-height: 1.8; cursor: text;
  }
  .notes-preview h1,.notes-preview h2,.notes-preview h3 { margin: 12px 0 6px; color: #1e3a5f; }
  .notes-preview h1 { font-size: 1.1rem; }
  .notes-preview h2 { font-size: 1rem; }
  .notes-preview h3 { font-size: .92rem; }
  .notes-preview table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: .84rem; }
  .notes-preview th,.notes-preview td { border: 1px solid #d1d5db; padding: 5px 10px; text-align: left; }
  .notes-preview th { background: #f1f5f9; font-weight: 600; color: #334155; }
  .notes-preview ul,.notes-preview ol { padding-left: 20px; margin: 6px 0; }
  .notes-preview p { margin: 6px 0; }
  .notes-preview strong { color: #1e3a5f; }
  .notes-preview blockquote { border-left: 3px solid #059669; padding-left: 12px; color: #64748b; margin: 8px 0; }
  .notes-preview code { background: #f1f5f9; padding: 1px 5px; border-radius: 3px; font-size: .82rem; }
  .notes-preview a { color: #2563eb; text-decoration: none; }
  .notes-preview a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <div>
    <h1>選股推薦</h1>
    <span style="font-size:.82rem;color:rgba(255,255,255,.7)" id="updatedAt"></span>
  </div>
  <div style="display:flex;gap:16px;align-items:center">
    <a href="/">回總表</a>
    <a href="/briefing.html">逍遙日報</a>
    <a href="/valuation.html">評價報告</a>
  </div>
</header>

<div class="container">
  <div class="notes-wrap">
    <div class="notes-header">
      <span class="notes-title">選股推薦</span>
      <button class="notes-mode-btn active" id="btnPreview" onclick="switchMode('preview')">預覽</button>
      <button class="notes-mode-btn" id="btnEdit" onclick="switchMode('edit')">編輯</button>
      <button onclick="copyPrompt()" style="padding:3px 10px;border:1px solid #059669;border-radius:5px;background:#fff;cursor:pointer;font-size:.75rem;color:#059669;font-weight:600">複製選股指令</button>
      <span id="statusEl" style="font-size:.75rem;color:#94a3b8"></span>
    </div>
    <div class="notes-preview" id="preview" onclick="switchMode('edit')">
      <div style="color:#cbd5e1">載入中...</div>
    </div>
    <textarea id="editor" oninput="onInput()" style="display:none;width:100%;min-height:500px;border:1px solid #e2e8f0;border-radius:8px;padding:12px;font-size:.85rem;font-family:'Microsoft JhengHei','Segoe UI',monospace;resize:vertical;line-height:1.6"></textarea>
  </div>
</div>

<script>
let _timer = null;

async function load() {
  try {
    const res = await fetch('/api/stock-picks');
    const data = await res.json();
    const content = data.content || '';
    document.getElementById('editor').value = content;
    if (data.updated_at) {
      document.getElementById('updatedAt').textContent = '最後更新：' + data.updated_at;
    }
    renderPreview();
  } catch(e) {
    document.getElementById('preview').innerHTML = '<div style="color:#ef4444">載入失敗: ' + e.message + '</div>';
  }
}

function renderPreview() {
  const text = document.getElementById('editor').value || '';
  const preview = document.getElementById('preview');
  if (text.trim()) {
    preview.innerHTML = typeof marked !== 'undefined' ? marked.parse(text) : text.replace(/\n/g, '<br>');
    // 讓表格內的股票代碼可以點擊
    preview.querySelectorAll('td').forEach(td => {
      const code = td.textContent.trim();
      if (/^\d{4}$/.test(code)) {
        td.innerHTML = `<a href="/company.html?code=${code}" target="_blank" style="font-weight:700;color:#2563eb">${code}</a>`;
      }
    });
  } else {
    preview.innerHTML = '<span style="color:#cbd5e1">無推薦內容，點擊編輯或複製選股指令</span>';
  }
}

function switchMode(mode) {
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const btnEdit = document.getElementById('btnEdit');
  const btnPreview = document.getElementById('btnPreview');
  if (mode === 'edit') {
    editor.style.display = '';
    preview.style.display = 'none';
    btnEdit.classList.add('active');
    btnPreview.classList.remove('active');
    editor.focus();
  } else {
    renderPreview();
    editor.style.display = 'none';
    preview.style.display = '';
    btnPreview.classList.add('active');
    btnEdit.classList.remove('active');
  }
}

function onInput() {
  const statusEl = document.getElementById('statusEl');
  if (statusEl) statusEl.textContent = '編輯中...';
  clearTimeout(_timer);
  _timer = setTimeout(() => {
    const text = document.getElementById('editor').value;
    fetch('/api/stock-picks', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({content: text})
    });
    if (statusEl) statusEl.textContent = '已自動儲存 ' + new Date().toLocaleTimeString('zh-TW');
  }, 800);
}

function copyPrompt() {
  const today = new Date().toISOString().slice(0,10);
  const prompt = `請幫我從逍遙投資系統 DB 篩選出目前最值得關注的 50 家公司。依類型分別提供重倉/小買候選，最後列觀望名單。

【資料來源】
從 stocks.db 讀取：
- stocks 表（EPS 5季+6年、股利6年、財務等級6年、評價門檻val_aa/a1/a2/a、營收年增、法人買賣超、配息率payout_1~5）
- stock_checklist 表（45項檢核含 profit_count/safety_count/value_count/growth_eval_count、gi_neff_d/gi_lynch_d、gi_roic_avg/gi_roe_avg/gi_opm_avg、gi_shiller_avg_eps/gi_shiller_pe/gi_shiller_alert、growth_signal、red_flags、gi_rev_cagr_3y/5y、growth_inv_risk）
- financial_annual 表（年度三表、earnings_quality）
- pe_history 表（pe_high/pe_low，算5年區間與中位數，pe_high 超過 20 以 20 計算）
- quarterly_financial 表（季度EPS趨勢）

【信任門檻（硬排除）】
1. 排除 KY/DR（code/name 含 -KY、code 以 910 開頭）
2. 排除金融保險業
3. 排除上市不足 5 年（listed_date 格式 YYYYMMDD）
4. 排除連續配息不足 3 年（div_c1/c2/c3 任一為 NULL 或 0）
5. 近5年財務等級（fin_grade_1~fin_grade_5）有3年以上落在 B1/B2/C/D/X（含+/-變體，即 base 去掉+/-後為 B1/B2/C/D/X）則排除。B1A/B2A 不算差。

【林區分類（每支標一個）】
- 景氣循環：6年EPS 最高/最低 > 2.5倍
- 快速成長：gi_rev_cagr_3y > 15%（非循環）
- 穩健股：gi_rev_cagr_3y 5~15%（非循環）
- 緩慢成長：gi_rev_cagr_3y < 5% 且振幅 < 1.5倍
- 轉機股：前一年財務等級（fin_grade_2）為 C/D/X（含+/-），今年（fin_grade_1）跳到 B2A 以上（含+/-）

【四維度評估】
A. 獲利性：profit_count、ROIC均值、毛利率趨勢（3年連降=警訊）、盈餘品質
B. 安全性：safety_count >= 10、負債比、FCF穩定性、等級穩定度
C. 價值：依類型用不同估值標準（見下方）
D. 成長：燈號、3M/12M營收、Neff、PEG、合約負債變化、季度EPS趨勢

【防呆檢查】
- 價值陷阱：毛利率連3年下滑 + 便宜超過1000天 → 標註
- 循環高點：席勒alert < 0.7 → 但先檢查6年EPS有無極端值（任一年為負或 min/max < 0.15）。有極端值 → alert不可靠，改標註「席勒PE含極端值」不排除；無極端值 → 確認是循環高點，排除
- 股利不可持續：EPS連2年降幅 > 20% 但股利完全不降 → 標註（小幅下降維持配息不觸發）
- 存貨風險：growth_inv_risk = 1 → 標註（不阻擋重倉，由質性研究確認是正常備貨還是滯銷）
- 股本變動大：gi_shares_change 絕對值 > 50% → 循環股直接排除；20~50% → 標註，最多小買
- EPS極端值（所有類型）：6年EPS任一年為負 或 min/max < 0.15 → 標註「EPS含極端值」，PE相關判斷可能失真，最多小買不進重倉。gi_shares_change為None時也用此規則偵測疑似股本變動。

【三類型各自的估值標準與重倉/小買/觀望條件】

■ 價值精選（緩慢成長 + 穩健股，用逍遙評價法）
估值指標：逍遙評價門檻（val_aa/a1/a2/a vs 股價）
PE：綜合PE（blend_pe = 股價/綜合EPS）
殖利率：綜合殖利率（blend_yld = 綜合股利/股價）
營收判斷用實際數據（不用燈號）：3M營收(gi_rev_3m_yoy)、12M營收(gi_rev_12m_yoy)、累積營收(revenue_cum_yoy)
重倉條件：股價 <= val_aa + 3M>=0 + 3M>=12M + 累積營收年增率>0 + 通過防呆 + 近2年財務等級（fin_grade_1, fin_grade_2）皆 A 以上（財務等級排序第15以內，即 AA/A1/A2/A/B1A 含+/-）
小買條件：股價 <= val_a + 3M>=0 + 累積營收年增率>0
觀望條件：財務等級 A 以上（排序第15以內）+ 股價 <= val_a + (3M<0 或累積營收年增率<0)
觀望不限支數，符合距離條件都列。觀望標目標進場價。
表格欄位：代碼 | 名稱 | 林區分類 | 等級 | 評價等級 | 股價 | 3M營收 | 12M營收 | 累積營收 | 綜合PE | PE區間(低/中/高) | 綜合殖利率 | 便宜天數 | 理由/等什麼

■ 成長精選（快速成長股，用 PEG/Neff + 沈董PE）
估值指標：PEG（gi_lynch_d = 近4季PE / 保守成長率）、Neff（gi_neff_d = (保守成長率+殖利率) / 近4季PE）
保守成長率 g = min(3年EPS CAGR, 5年EPS CAGR)。total_return = g + 殖利率。PEG = PE/total_return，Neff = total_return/PE（互為倒數，值一定同時存在）。但 gray 標記不同：neff_gray = g<=0 或成長斷層>=2年；lynch_gray = 一致性<0.5。PEG/Neff 都顯示實際數值，被 gray 標記的加(灰)。
沈董PE（shen_pe = 股價 / 沈董EPS），上限 20 倍。
營收CAGR = gi_rev_cagr_3y（3年營收複合成長率）。
不用逍遙評價門檻。
營收判斷用實際數據（不用燈號）：3M營收、累積營收
重倉條件：沈董PE <= 20 + (PEG <= 0.8 或 Neff >= 1.2) + 3M>0 + 累積>0 + 3M>12M + 通過防呆
小買條件：沈董PE <= 20 + (PEG <= 1.2 或 Neff >= 0.8) + 3M>0 + 累積>0 + 通過防呆
觀望條件：沈董PE <= 20 + (PEG <= 1.2 或 Neff >= 0.8) + (3M<0 或累積<0) + 通過防呆
觀望不限支數。
加分：ROIC 隨營收成長穩定或上升 = 再投資護城河
扣分：ROIC 下降 + 營收成長 = 靠燒錢成長
表格欄位：代碼 | 名稱 | 等級 | 股價 | 3M營收 | 12M營收 | 累積營收 | 營收CAGR(3年) | PEG | Neff | ROIC(5年均) | 沈董PE | PE區間(低/中/高) | 理由

■ 循環反轉（景氣循環 + 轉機股，用正常化PE + 復甦進度 + 復甦訊號，聶夫+馬克思思維）
硬排除：近4季EPS(eps_4q_sum) <= 0 或復甦進度 > 2.0 不列入。
估值指標：正常化PE = 股價 / 正常化EPS。不用逍遙評價門檻。
正常化EPS算法：取6年EPS(eps_y1~y6)，若 max/均值 > 1.8 有極端值用中位數，否則用平均數。表格標註用的是中位數或平均。
復甦進度 = 近4季EPS(eps_4q_sum) / 正常化EPS（衡量目前EPS相對正常水準的位置）：>2.0 排除（高峰）、1.5~2.0 降一級、0.5~1.5 正常評估、<0.5 觀望（谷底）。
紅燈不排除（循環谷底本來就是紅燈）
重倉條件：正常化PE <= 10 + 復甦進度 0.5~1.5 + 復甦訊號 3/3 + 3M>12M + 通過防呆
小買條件：正常化PE <= 10 + 復甦進度 0.5~1.5 + 訊號 >= 2/3 + 通過防呆，或 正常化PE 10~12 + 復甦進度 0.5~1.5 + 訊號 >= 2/3 + 通過防呆，或 原本符合重倉但復甦進度 1.5~2.0（降級）
觀望條件：正常化PE <= 15 + (復甦進度 < 0.5 或訊號 < 2/3)，或 原本符合小買但復甦進度 1.5~2.0（降級）。正常化PE > 15 距離太遠不列入。
復甦訊號（0~3）：3M營收轉正(gi_rev_3m_yoy>0) / 毛利率止穩(>=5年均值95%) / 累積營收成長率為正(revenue_cum_yoy>0)
循環位置：高峰(alert<0.7) / 回落(0.7~1.0) / 谷底(>1.2) / 復甦初期(>1.0且3M轉正)
EPS振幅 = 6年EPS最高/最低倍數，>2.5x判定為循環股。正常化EPS = 6年EPS中位數(有極端值)或平均。正常化PE = 股價/正常化EPS。
表格欄位：代碼 | 名稱 | 等級 | 股價 | 累積營收成長率 | EPS振幅(6年高/低) | 近4季EPS | 正常化EPS(算法) | 復甦進度 | 循環位置 | 正常化PE | 復甦訊號 | 理由

【觀望分三組，欄位跟各自的重倉/小買一致】
■ 價值觀望：財務等級 A 以上 + 股價 <= val_a + (3M<0 或累積營收年增率<0)
表格欄位同重倉/小買：代碼 | 名稱 | 林區分類 | 等級 | 評價等級 | 股價 | 3M營收 | 12M營收 | 累積營收 | 綜合PE | PE區間(低/中/高) | 綜合殖利率 | 便宜天數 | 等什麼(含目標價)
■ 成長觀望：沈董PE <= 20 + (PEG <= 1.2 或 Neff >= 0.8) + (3M<0 或累積<0) + 通過防呆
表格欄位同重倉/小買：代碼 | 名稱 | 等級 | 股價 | 3M營收 | 12M營收 | 累積營收 | 營收CAGR(3年) | PEG | Neff | ROIC(5年均) | 沈董PE | PE區間(低/中/高) | 等什麼
■ 循環觀望：正常化PE <= 15 + (復甦進度 < 0.5 或訊號 < 2/3)，或小買降級（復甦進度 1.5~2.0）。PE > 15 太遠不列。
表格欄位同重倉/小買：代碼 | 名稱 | 等級 | 股價 | 累積營收 | EPS振幅(6年高/低) | 近4季EPS | 正常化EPS(算法) | 復甦進度 | 循環位置 | 正常化PE | 復甦訊號 | 等什麼

觀望不限支數，符合距離條件都列出。
低流動性（日均量<100,000）標註[低流動性]。
表格內股票代碼只寫 4 碼數字，不要加連結語法。
所有重倉/小買標註「需完成質性研究確認」。

【變化追蹤】
產出結果前，先從 Render 讀取上一次選股推薦內容（curl -s https://tock-system.onrender.com/api/stock-picks），提取各區塊（價值/成長/循環）的股票代碼，與本次結果比對。
在每個區塊（價值精選/成長精選/循環反轉）的表格下方，用註記格式標示該區塊的變動：
> 新進：1234 名稱A、5678 名稱B
>
> 移出：9012、3456

【完成後自動存入 Render】
curl -X POST https://tock-system.onrender.com/api/stock-picks -H "Content-Type: application/json" -d '{"content":"結果內容"}'

分析日期：${today}`;

  navigator.clipboard.writeText(prompt).then(() => {
    const el = document.getElementById('statusEl');
    if (el) el.textContent = '選股指令已複製到剪貼簿';
  });
}

load();
</script>
</body>
</html>
